name: Deploy GMS Locker to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "public/**"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "sponsor.html"
      - "sponsor-page.css"
      - "*.jpeg"
      - "*.svg"
      - "*.png"
      - "CNAME"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage frontend-only site
        run: |
          mkdir -p _site/public
          cp index.html manifest.webmanifest service-worker.js sponsor.html sponsor-page.css CNAME _site/
          cp *.jpeg *.svg *.png _site/
          cp public/*.js public/*.css _site/public/

      - name: Verify staged premium depth build
        run: |
          grep -q "Franchise Intelligence System" _site/index.html
          grep -q "depth-chart.js" _site/index.html
          test -f _site/public/depth-chart.js
          test -f _site/public/depth-chart.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Pages build
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in 1 2 3 4 5 6; do
            html=$(curl --fail --silent --show-error "$url" || true)
            if echo "$html" | grep -q "Franchise Intelligence System" && echo "$html" | grep -q "depth-chart.js"; then
              echo "GitHub Pages is serving the premium depth-chart build."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages deployment is not serving the expected build."
          exit 1
