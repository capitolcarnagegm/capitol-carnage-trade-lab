name: Deploy Cloudflare AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - agent/private-free-ai-clean
    paths:
      - "multi-ai-worker/**"
      - ".github/workflows/deploy-cloudflare-ai.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: gms-locker-db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multi-ai-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Discover existing D1 database and build Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          cp wrangler.example.jsonc wrangler.jsonc
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          raw = json.loads(Path("/tmp/d1-list.json").read_text())
          if isinstance(raw, dict):
              databases = raw.get("result") or raw.get("databases") or raw.get("items") or []
          else:
              databases = raw

          name = os.environ["CLOUDFLARE_D1_DATABASE_NAME"]
          match = next((db for db in databases if db.get("name") == name), None)
          if not match:
              raise SystemExit(f"Cloudflare D1 database {name!r} was not found")

          database_id = match.get("uuid") or match.get("database_id") or match.get("id")
          if not database_id:
              raise SystemExit(f"Cloudflare did not return an ID for D1 database {name!r}")

          path = Path("wrangler.jsonc")
          text = path.read_text()
          text = text.replace('"database_name": "your-private-d1"', f'"database_name": "{name}"')
          text = text.replace('"database_id": "replace-locally-and-never-commit"', f'"database_id": "{database_id}"')
          path.write_text(text)
          print(f"Using D1 database: {name}")
          PY

      - name: Run tests
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config wrangler.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
