name: Deploy Cloudflare AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - agent/private-free-ai-clean
    paths:
      - "multi-ai-worker/**"
      - ".github/workflows/deploy-cloudflare-ai.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multi-ai-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_D1_DATABASE_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}

      - name: Build CI Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.example.jsonc wrangler.jsonc
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("wrangler.jsonc")
          text = path.read_text()
          text = text.replace('"database_name": "your-private-d1"', f'"database_name": "{os.environ["CLOUDFLARE_D1_DATABASE_NAME"]}"')
          text = text.replace('"database_id": "replace-locally-and-never-commit"', f'"database_id": "{os.environ["CLOUDFLARE_D1_DATABASE_ID"]}"')
          path.write_text(text)
          PY
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}

      - name: Run tests
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
