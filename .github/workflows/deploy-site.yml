name: Deploy GMS Locker Site

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "public/**"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "sponsor-page.css"
      - "*.jpeg"
      - "*.svg"
      - "*.png"
      - "CNAME"
      - "wrangler-site.toml"
      - ".assetsignore"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Verify premium build before deploy
        run: |
          grep -q "Depth Charts" index.html
          test -f depth-chart.html
          grep -q "ALL 32 NFL TEAMS" depth-chart.html
          test -f public/depth-page.js
          test -f public/depth-chart.css
          test -f franchise-os.html
          grep -q "FRANCHISE OS" franchise-os.html
          test -f public/franchise-os.js
          test -f public/franchise-os.css
      - name: Deploy static site
        run: npx wrangler deploy --config wrangler-site.toml | tee /tmp/deploy-output.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production domain
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            home=$(curl --fail --silent --show-error https://gmslocker.com/ || true)
            depth=$(curl --fail --silent --show-error https://gmslocker.com/depth-chart.html || true)
            os=$(curl --fail --silent --show-error https://gmslocker.com/franchise-os.html || true)
            if echo "$home" | grep -q "Depth Charts" && echo "$depth" | grep -q "ALL 32 NFL TEAMS" && echo "$os" | grep -q "FRANCHISE OS"; then
              echo "Production is serving GMS Locker premium build."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose the premium build."
          exit 1
