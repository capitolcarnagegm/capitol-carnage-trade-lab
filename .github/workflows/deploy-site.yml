name: Deploy GMS Locker Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "public/**"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "sponsor.html"
      - "sponsor-page.css"
      - "*.jpeg"
      - "*.svg"
      - "*.png"
      - "CNAME"
      - "wrangler-site.toml"
      - ".assetsignore"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Deploy static site
        run: npx wrangler deploy --config wrangler-site.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production site
        run: |
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://gmslocker.com/ | grep -q "Fantrax stays read-only, always"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
