name: Deploy GMS Locker Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "public/**"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "sponsor.html"
      - "sponsor-page.css"
      - "*.jpeg"
      - "*.svg"
      - "*.png"
      - "CNAME"
      - "wrangler-site.toml"
      - ".assetsignore"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Deploy static site
        run: npx wrangler deploy --config wrangler-site.toml | tee /tmp/deploy-output.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify workers.dev deployment
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy-output.txt | head -1)
          if [ -z "$url" ]; then
            echo "Could not find a workers.dev URL in deploy output; skipping content check."
            exit 0
          fi
          echo "Checking $url"
          for i in 1 2 3 4 5 6; do
            html=$(curl --fail --silent --show-error "$url" || true)
            if echo "$html" | grep -q "Franchise Intelligence System" && echo "$html" | grep -q "depth-chart.js"; then
              echo "Premium site and live depth UI are deployed."
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not expose the current premium depth-chart build."
          exit 1
