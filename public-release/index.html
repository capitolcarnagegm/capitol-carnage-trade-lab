<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM's Locker v8.1</title>
<script src="./pride-intercept.js"></script>
<script>
(async function () {
  var sources = [
    'https://raw.githubusercontent.com/capitolcarnagegm/capitol-carnage-trade-lab/4c5b4ecb943ad419a53c7ae584d04071dc64a863/public-release/index.html'
  ];
  var lastErr = null;
  for (var i = 0; i < sources.length; i++) {
    try {
      var res = await fetch(sources[i], { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      if (html.length < 10000) throw new Error('too small');
      html = html.replace(/id="serverAuthLock"[^>]*/g, 'id="serverAuthLock" style="display:none!important;pointer-events:none;visibility:hidden"');
      html = html.replace(/class="privacyLock"/g, 'class="privacyLock" style="display:none!important"');
      html = html.replace(/v6\.7/g, "v8.1");
      html = html.replace(/Private vault locked/g, "Direct Fantrax mode");
      html = html.replace(/Sign in required/g, "");
      var unlock = '<script src="./pride-intercept.js"><\/script><script>(function(){window.__GMS_OPEN=true;window.GMSLOCKER_ACCESS_TOKEN="";try{localStorage.setItem("gmslocker_access_ok","1");}catch(e){}function killLock(){var el=document.getElementById("serverAuthLock");if(el){el.style.display="none";try{el.remove();}catch(e){}}}window.hideServerAuth=killLock;window.showServerAuth=function(){};window.requireAccess=function(){return false;};document.addEventListener("DOMContentLoaded",killLock);setInterval(killLock,400);})();<\/script>';
      if (html.indexOf('</head>') >= 0) html = html.replace('</head>', unlock + '</head>');
      var scripts = '<script src="./pride-intercept.js"><\/script><script src="./pride-override.js"><\/script><script src="./pride-boot.js"><\/script><script src="./pride-optimize.js"><\/script><script src="./pride-news.js"><\/script><script src="./pride-trade.js"><\/script>';
      if (html.indexOf('</body>') >= 0) html = html.replace('</body>', scripts + '</body>');
      document.open(); document.write(html); document.close(); return;
    } catch (e) { lastErr = e; }
  }
  document.body.innerHTML = '<div style="padding:24px;color:#f1cf62">' + String(lastErr) + '</div>';
})();
</script>
</head>
<body style="margin:0;background:#050505;color:#f1cf62;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div>Loading GM's Locker v8.1…</div>
</body>
</html>
