function clone(x){return JSON.parse(JSON.stringify(x))}
let db=loadDB();
function loadDB(){try{const x=JSON.parse(localStorage.getItem('ccgm_db'));if(x&&x.assets)return x}catch(e){}return {config:clone(DEFAULT_CONFIG),assets:clone(seedAssets),prospects:clone(seedProspects),history:[],savedTrades:[],savedFA:[],lastSync:null,mfl:{host:'www45.myfantasyleague.com',year:2026,leagueId:'29218',apiKey:''}}}
function persist(){localStorage.setItem('ccgm_db',JSON.stringify(db))}
function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,Number(n)||0))}
function fmt(n){return Math.round(Number(n)||0).toLocaleString()}
function pct(n){return ((Number(n)||0)*100).toFixed(1)+'%'}
function posScarcity(pos){let base={QB:94,RB:80,WR:76,TE:88,EDGE:91,DL:84,LB:77,S:70,CB:58,PICK:78}[pos]||70;if(pos==='QB'&&db.config.superflex)base+=5;if(pos==='TE'&&db.config.tep)base+=5;if((pos==='EDGE'||pos==='DL')&&db.config.sackPremium)base+=6;return clamp(base)}
function ageScore(a){if(!a||a.type==='PICK')return 82;let peak={QB:29,RB:24,WR:26,TE:27,EDGE:27,DL:27,LB:26,S:27,CB:26}[a.pos]||26;let dist=Math.abs((a.age||peak)-peak);return clamp(96-dist*6)}
function replacement(a){return Number(db.config.replacement[a.pos]||0)}
function projectionScore(a){if(a.type==='PICK')return clamp((a.classStrength||75)*.82 + pickSlotScore(a)*.18);let repl=replacement(a);let above=(Number(a.proj)||0)-repl;return clamp(60+above/2.2)}
function pickSlotScore(a){let p=a.slotProb||{};return clamp((p.early||0)*1+(p.mid||0)*.78+(p.late||0)*.58)}
function contractScore(a){if(a.type==='PICK')return 91;if(a.salary===undefined||a.salary==='')return 70;let cap=db.config.salaryCap||1000;let salPct=(Number(a.salary)||0)/cap;let control=Math.min(5,Number(a.years)||0);let prod=projectionScore(a);return clamp(68+prod*.25-salPct*170+control*4.5)}
function roleScore(a){if(a.type==='PICK')return clamp((a.classStrength||75)*.75+pickSlotScore(a)*.25);return clamp(a.role||60)}
function marketScore(a){let m=Number(a.market)||0;return clamp(45+Math.log10(Math.max(1,m))*13)}
function trendScore(a){return clamp(70+(Number(a.trend)||0)*2.2)}
function riskScore(a){return clamp(100-(Number(a.risk)||35))}
function liquidityScore(a){return clamp(a.liquidity||65)}
function arbitrage(a){if(a.type==='PICK')return (modelValue(a)-(Number(a.market)||0))/Math.max(1,Number(a.market)||1);let adpEdge=(a.adp&&a.ecr)?(Number(a.adp)-Number(a.ecr))/Math.max(20,Number(a.adp)):0;let projEdge=(projectionScore(a)-marketScore(a))/100;return adpEdge*.35+projEdge*.65}
function prideScore(a){const w=db.config.weights;return clamp(marketScore(a)*w.market+projectionScore(a)*w.projection+roleScore(a)*w.replacement+contractScore(a)*w.contract+ageScore(a)*w.age+roleScore(a)*w.role+trendScore(a)*w.trend+posScarcity(a.pos)*w.scarcity+liquidityScore(a)*w.liquidity+riskScore(a)*w.risk)}
function pickMultiplier(a){let yearDisc=Math.max(.72,1-(Math.max(0,(Number(a.year)||2027)-2027)*.08));let roundMult={1:1,2:.62,3:.32,4:.16}[a.round]||.12;let cls=(Number(a.classStrength)||75)/85;let slot=(pickSlotScore(a)/78);return yearDisc*roundMult*cls*slot}
function modelValue(a){let base=Number(a.market)||0;if(a.type==='PICK'){let anchor=a.round===1?5400:a.round===2?2500:a.round===3?1100:600;return Math.round((base*.45+anchor*pickMultiplier(a)*.55)*(1+(Number(a.trend)||0)/100))}let score=prideScore(a);let proj=projectionScore(a);let contract=contractScore(a);let arb=arbitrage(a);return Math.max(50,Math.round(base*(.58+score/215)*(1+arb*.12)*(1+(contract-70)/420)*(1+(proj-70)/500)))}
function titleImpact(a){if(a.type==='PICK')return clamp(55+(a.year===2027?10:0));return clamp(projectionScore(a)*.55+roleScore(a)*.25+posScarcity(a.pos)*.2)}
function prongs(a){return {Production:projectionScore(a),'Roster Fit':clamp((titleImpact(a)+posScarcity(a.pos))/2),'Market Timing':trendScore(a),'Contract Value':contractScore(a),'Championship Impact':titleImpact(a),'Cap Leverage':clamp(contractScore(a)*.72+liquidityScore(a)*.28),'Outside Market':liquidityScore(a)}}
function signal(a){let ar=arbitrage(a);let mv=modelValue(a),m=Number(a.market)||1;let edge=(mv-m)/m;if(edge>.18&&Number(a.trend)>=0)return ['STRONG BUY','good'];if(edge>.07)return ['BUY','good'];if(edge<-.18)return ['SELL HIGH','bad'];if(edge<-.07)return ['SHOP','warn'];if(Number(a.trend)<-6)return ['FALLING','bad'];return ['HOLD','blue']}
function recordHistory(asset,oldValue){let nv=modelValue(asset);if(oldValue&&Math.abs(nv-oldValue)/oldValue<.01)return;db.history.unshift({id:uid('hist'),assetId:asset.id,name:asset.name,date:new Date().toISOString(),oldValue:oldValue||nv,newValue:nv,reason:asset.lastReason||'Data/model update'});db.history=db.history.slice(0,300)}

function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));renderView(id);localStorage.setItem('ccgm_view',id)}
function renderView(id){({dashboard:renderDashboard,trade:renderTrade,fa:renderFA,draft:renderDraft,market:renderMarket,sync:renderSync,settings:renderSettings}[id]||renderDashboard)()}
function dashboardCards(){let mine=db.assets.filter(a=>a.roster===db.config.teamName&&a.type==='PLAYER');let total=mine.reduce((s,a)=>s+modelValue(a),0);let proj=mine.reduce((s,a)=>s+(Number(a.proj)||0),0);let cap=mine.reduce((s,a)=>s+(Number(a.salary)||0),0);let buys=db.assets.filter(a=>signal(a)[0].includes('BUY')).length;return {mine,total,proj,cap,buys}}
function renderDashboard(){let x=dashboardCards();let movers=db.history.slice(0,6);let buys=db.assets.slice().sort((a,b)=>arbitrage(b)-arbitrage(a)).slice(0,5);dashboard.innerHTML=`<div class="grid4"><div class="metric"><b>${fmt(x.total)}</b><span>Roster Pride value</span></div><div class="metric"><b>${fmt(x.proj)}</b><span>Projected points on roster</span></div><div class="metric"><b>$${x.cap.toFixed(2)}</b><span>Known active salary</span></div><div class="metric"><b>${x.buys}</b><span>Current buy signals</span></div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="sectionhead"><h2>Best Market Inefficiencies</h2><span class="pill">Model vs market</span></div>${buys.map(a=>assetMini(a)).join('')}</div><div class="card"><div class="sectionhead"><h2>Recent Value Movement</h2><span class="pill">History</span></div>${movers.length?movers.map(h=>`<div class="gate"><span><b>${h.name}</b><br><span class="small">${h.reason}</span></span><b class="${h.newValue>=h.oldValue?'good':'bad'}">${h.newValue>=h.oldValue?'+':''}${fmt(h.newValue-h.oldValue)}</b></div>`).join(''):'<div class="notice">Value changes will appear here as you edit players, sync the league or update projections/ADP.</div>'}</div></div><div class="card" style="margin-top:12px"><h2>GM Philosophy</h2><div class="small">The app separates public market price from our calculated football value. The goal is not to predict every breakout; it is to repeatedly buy production, cap efficiency and appreciating assets below the market price and sell expensive assets when the market outruns the underlying football value.</div></div>`}
function assetMini(a){let s=signal(a),mv=modelValue(a),edge=(mv-(Number(a.market)||0))/Math.max(1,Number(a.market)||1);return `<div class="gate"><span><b>${a.name}</b> <span class="tag">${a.pos}</span><br><span class="small">Market ${fmt(a.market)} · Pride ${fmt(mv)} · ${pct(edge)} mispricing</span></span><b class="${s[1]}">${s[0]}</b></div>`}

let tradeState={receive:[],give:[],lens:'overall',opponent:'',ourPos:'ALL',oppPos:'ALL'};

function ensureTradeOpponent(){
  const teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(Boolean);
  if(!tradeState.opponent || tradeState.opponent===db.config.teamName || !teams.includes(tradeState.opponent)){
    tradeState.opponent=teams.find(n=>n!==db.config.teamName) || '';
  }
}
function teamAssets(team){
  return db.assets.filter(a=>String(a.roster||'').toLowerCase()===String(team||'').toLowerCase());
}
function assetPos(a){
  if(a.type==='PICK') return 'PICKS';
  let p=String(a.pos||'').toUpperCase();
  if(['DE','DT','EDGE','DL'].includes(p)) return 'DL';
  if(['CB','S','DB'].includes(p)) return 'DB';
  if(['PK','K'].includes(p)) return 'K';
  return p||'OTHER';
}
function addAssetToTrade(side,assetId){
  if(!assetId)return;
  if(tradeState[side].some(x=>x.assetId===assetId)) return;
  tradeState[side].push({assetId,salaryOverride:'',yearsOverride:''});
  renderTrade();
}
function addTrade(side){tradeState[side].push({assetId:'',salaryOverride:'',yearsOverride:''});renderTrade()}
function removeTrade(side,i){tradeState[side].splice(i,1);renderTrade()}
function tradeAsset(obj){
  let a=db.assets.find(x=>x.id===obj.assetId);if(!a)return null;a=clone(a);
  if(obj.salaryOverride!=='')a.salary=Number(obj.salaryOverride);
  if(obj.yearsOverride!=='')a.years=Number(obj.yearsOverride);
  return a
}
function sideValue(side,lens='overall'){
  return tradeState[side].reduce((s,o)=>{
    let a=tradeAsset(o);if(!a)return s;
    if(lens==='market')return s+(Number(a.market)||0);
    if(lens==='points')return s+(Number(a.proj)||0)*20;
    if(lens==='contract')return s+contractScore(a)*70;
    if(lens==='title')return s+titleImpact(a)*75;
    if(lens==='future')return s+(a.type==='PICK'?modelValue(a):modelValue(a)*(ageScore(a)/100));
    return s+modelValue(a)
  },0)
}
function sideAvgProng(side,k){
  let arr=tradeState[side].map(tradeAsset).filter(Boolean);
  return arr.length?arr.reduce((s,a)=>s+prongs(a)[k],0)/arr.length:0
}
function tradeCartRows(side){
  const arr=tradeState[side].map((o,i)=>({o,i,a:tradeAsset(o)})).filter(x=>x.a);
  if(!arr.length)return `<div class="notice">Tap an asset from the roster above.</div>`;
  return arr.map(({o,i,a})=>`<div class="cartItem">
    <div><div class="name">${a.name} ${a.type==='PICK'?'<span class="pickBadge">PICK</span>':''}</div>
      <div class="smallrow">${assetPos(a)} · ${a.type==='PICK'?'Draft capital':('$'+Number(a.salary||0).toFixed(2)+' / '+(a.years||0)+' yr')} · ${fmt(modelValue(a))} Pride</div>
    </div>
    <button class="danger" onclick="removeTrade('${side}',${i})">×</button>
  </div>`).join('')
}
function rosterPositionTabs(side,selected){
  const tabs=['ALL','QB','RB','WR','TE','DL','LB','DB','PICKS'];
  return `<div class="posTabs">${tabs.map(p=>`<button class="${selected===p?'active secondary':'secondary'}" onclick="tradeState.${side}Pos='${p}';renderTrade()">${p}</button>`).join('')}</div>`;
}
function rosterPanel(team,side,posFilter,isOpponent=false){
  const assets=teamAssets(team).sort((a,b)=>{
    const pa=assetPos(a),pb=assetPos(b);
    const order=['QB','RB','WR','TE','DL','LB','DB','K','PICKS','OTHER'];
    return order.indexOf(pa)-order.indexOf(pb) || modelValue(b)-modelValue(a);
  });
  if(!assets.length){
    return `<div class="notice">No synced roster assets found for <b>${team||'this team'}</b>. Run MFL Sync once; GM Lab will retain the snapshot afterward.</div>`;
  }
  const visible=posFilter==='ALL'?assets:assets.filter(a=>assetPos(a)===posFilter);
  const groups={};
  visible.forEach(a=>(groups[assetPos(a)]??=[]).push(a));
  const order=['QB','RB','WR','TE','DL','LB','DB','K','PICKS','OTHER'];
  return order.filter(p=>groups[p]?.length).map(p=>`<div class="posGroup">
    <div class="posTitle">${p} · ${groups[p].length}</div>
    ${groups[p].map(a=>{
      const inTrade=tradeState[side].some(x=>x.assetId===a.id);
      return `<div class="rosterPlayer">
        <div>
          <div class="name">${a.name}</div>
          <div class="meta">${a.type==='PICK'
            ? `Draft asset · ${a.year||''} ${a.round?('R'+a.round):''}`
            : `${a.nfl||''} · $${Number(a.salary||0).toFixed(2)} · ${a.years||0} yr · Proj ${Number(a.proj||0).toFixed(0)}`}</div>
        </div>
        <div class="quick"><span class="val">${fmt(modelValue(a))}</span>
          <button ${inTrade?'disabled':''} onclick="addAssetToTrade('${side}','${a.id}')">${inTrade?'Added':'+ Trade'}</button>
        </div>
      </div>`
    }).join('')}
  </div>`).join('') || `<div class="muted">No ${posFilter} assets on this roster.</div>`;
}
function postTradeImpact(){
  const get=tradeState.receive.map(tradeAsset).filter(Boolean);
  const give=tradeState.give.map(tradeAsset).filter(Boolean);
  const points=get.reduce((s,a)=>s+(Number(a.proj)||0),0)-give.reduce((s,a)=>s+(Number(a.proj)||0),0);
  const salary=get.reduce((s,a)=>s+(Number(a.salary)||0),0)-give.reduce((s,a)=>s+(Number(a.salary)||0),0);
  const value=get.reduce((s,a)=>s+modelValue(a),0)-give.reduce((s,a)=>s+modelValue(a),0);

  const warnings=[];
  const our=teamAssets(db.config.teamName).filter(a=>a.type!=='PICK');
  const giveIds=new Set(give.map(a=>a.id));
  const getPlayers=get.filter(a=>a.type!=='PICK');
  for(const pos of ['QB','RB','WR','TE','DL','LB','DB']){
    const before=our.filter(a=>assetPos(a)===pos).length;
    const outgoing=give.filter(a=>assetPos(a)===pos && a.type!=='PICK').length;
    const incoming=getPlayers.filter(a=>assetPos(a)===pos).length;
    const after=before-outgoing+incoming;
    if(before>=2 && after<2) warnings.push(`${pos} depth falls to ${after}`);
    if(before===1 && after===0) warnings.push(`${pos} room becomes empty`);
  }
  return {points,salary,value,warnings};
}
function tradeAnalysis(){
  let lens=tradeState.lens,r=sideValue('receive',lens),g=sideValue('give',lens),edge=g?(r-g)/g:0;
  let needle=clamp(50-edge*110,5,95);
  let prongKeys=['Production','Roster Fit','Market Timing','Contract Value','Championship Impact','Cap Leverage','Outside Market'];
  let pass=0;
  let prongRows=prongKeys.map(k=>{
    let rv=sideAvgProng('receive',k),gv=sideAvgProng('give',k),p=rv>=db.config.threshold;
    pass+=p?1:0;
    return `<div class="gate"><span><b>${k}</b><br><span class="small">Receive ${rv.toFixed(0)} vs Give ${gv.toFixed(0)}</span></span><b class="${p?'good':'bad'}">${p?'PASS':'FAIL'} ${rv>=gv?'▲':'▼'}</b></div>`
  }).join('');
  let gates=[r>=g*.95,sideAvgProng('receive','Roster Fit')>=sideAvgProng('give','Roster Fit'),sideAvgProng('receive','Contract Value')>=sideAvgProng('give','Contract Value')-5,sideAvgProng('receive','Outside Market')>=sideAvgProng('give','Outside Market')-5];
  let gc=gates.filter(Boolean).length,majority=pass>=db.config.requiredProngs,hard=gc>=db.config.hardReq;
  let grade=edge>=.18?'A+':edge>=.12?'A':edge>=.07?'A-':edge>=.03?'B+':edge>=0?'B':edge>=-.04?'B-':edge>=-.08?'C+':'C';
  let verdict=!g?'ENTER TRADE':(majority&&hard&&edge>=-.04?(edge>=.12?'SMASH ACCEPT':edge>=.03?'ACCEPT':'APPROVE'):(edge>=-.08?'RENEGOTIATE':'REJECT'));
  let vc=verdict.includes('ACCEPT')||verdict==='APPROVE'?'vgood':verdict==='REJECT'?'vbad':'vwarn';
  return {r,g,edge,needle,prongRows,gates,gc,majority,hard,grade,verdict,vc}
}

  trade.innerHTML=`
  <div class="card">

          ${teams.map(n=>`<option ${tradeState.opponent===n?'selected':''}>${n}</option>`).join('')}
        </select></div>

      ${rosterPositionTabs('opp',tradeState.oppPos)}

  </div>

  <div class="tradeCart">
    <div class="cartBox"><div class="sectionhead"><h2>${db.config.teamName} GIVES</h2><span class="pill">${fmt(a.g)}</span></div>${tradeCartRows('give')}</div>
    <div class="cartBox"><div class="sectionhead"><h2>${db.config.teamName} RECEIVES</h2><span class="pill">${fmt(a.r)}</span></div>${tradeCartRows('receive')}</div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="sectionhead"><h2>Trade Balance Meter</h2><select style="width:auto" onchange="tradeState.lens=this.value;renderTrade()">
      <option value="overall" ${tradeState.lens==='overall'?'selected':''}>Overall Pride Value</option>
      <option value="market" ${tradeState.lens==='market'?'selected':''}>Market / ADP</option>
      <option value="points" ${tradeState.lens==='points'?'selected':''}>Projected Points</option>
      <option value="contract" ${tradeState.lens==='contract'?'selected':''}>Contract & Cap</option>
      <option value="title" ${tradeState.lens==='title'?'selected':''}>Championship Impact</option>
      <option value="future" ${tradeState.lens==='future'?'selected':''}>Future / Draft Capital</option>
    </select></div>
    <div class="grid4">
      <div class="metric"><b>${fmt(a.r)}</b><span>Receive</span></div>
      <div class="metric"><b>${fmt(a.g)}</b><span>Give</span></div>
      <div class="metric"><b class="${a.edge>=0?'good':'bad'}">${a.edge>=0?'+':''}${pct(a.edge)}</b><span>Value tilt</span></div>
      <div class="metric"><b>${a.grade}</b><span>Grade</span></div>
    </div>
    <div class="barWrap"><div class="balance"><div class="needle" style="left:${a.needle}%"></div></div><div class="acceptable"></div>
      <div class="barlabels"><span>CAP CARNAGE WIN</span><span>FAIR</span><span>OTHER SIDE WIN</span></div>
    </div>
    <div class="${'verdict '+a.vc}">${a.verdict}</div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="sectionhead"><h2>Post-Trade Roster Impact</h2><span class="pill">${tradeState.opponent||'Opponent'}</span></div>
    <div class="rosterImpact">
      <div class="metric"><b class="${impact.points>=0?'good':'bad'}">${impact.points>=0?'+':''}${impact.points.toFixed(0)}</b><span>Projected points</span></div>
      <div class="metric"><b class="${impact.salary<=0?'good':'bad'}">${impact.salary>=0?'+':''}$${impact.salary.toFixed(2)}</b><span>Salary change</span></div>
      <div class="metric"><b class="${impact.value>=0?'good':'bad'}">${impact.value>=0?'+':''}${fmt(impact.value)}</b><span>Pride value change</span></div>
      <div class="metric"><b class="${impact.warnings.length?'bad':'good'}">${impact.warnings.length}</b><span>Depth warnings</span></div>
    </div>
    ${impact.warnings.length?`<div class="notice" style="margin-top:9px"><b>Roster warning:</b> ${impact.warnings.join(' · ')}</div>`:`<div class="notice" style="margin-top:9px"><b>No obvious position-room hole</b> from the current asset swap.</div>`}
  </div>

  <div class="grid" style="margin-top:12px">
    <div class="card"><h2>7-Prong Majority Test</h2>${a.prongRows}<div class="gate"><span><b>Majority</b></span><b class="${a.majority?'good':'bad'}">${a.majority?'PASS':'FAIL'}</b></div></div>
    <div class="card"><h2>4 Hard Value Gates</h2>${['Receive ≥95% adjusted value','Roster construction improves/holds','Contract/cap remains defensible','Outside-market liquidity holds'].map((x,i)=>`<div class="gate"><span>${x}</span><b class="${a.gates[i]?'good':'bad'}">${a.gates[i]?'PASS':'FAIL'}</b></div>`).join('')}
      <div class="gate"><span><b>Hard Gate</b></span><b class="${a.hard?'good':'bad'}">${a.gc}/4 ${a.hard?'PASS':'FAIL'}</b></div><button onclick="saveTrade()">Save Analysis</button>
    </div>
  </div>`;
}
function saveTrade(){
  db.savedTrades.unshift({id:uid('trade'),date:new Date().toISOString(),opponent:tradeState.opponent,state:clone(tradeState),analysis:tradeAnalysis(),impact:postTradeImpact()});
  db.savedTrades=db.savedTrades.slice(0,50);persist();alert('Trade saved on this device.')
}

function renderFA(){let e=faEval();fa.innerHTML=`<div class="grid"><div class="card"><h2>Free Agency Value Checker</h2><div class="field"><label>Player</label><select onchange="faState.assetId=this.value;renderFA()"><option value="">Select player</option>${db.assets.filter(a=>a.type==='PLAYER').map(a=>`<option value="${a.id}" ${faState.assetId===a.id?'selected':''}>${a.name} · ${a.pos}</option>`).join('')}</select></div><div class="grid3"><div class="field"><label>Your contemplated bid</label><input type="number" value="${faState.bid}" oninput="faState.bid=Number(this.value);renderFA()"></div><div class="field"><label>Contract years</label><input type="number" value="${faState.years}" oninput="faState.years=Number(this.value);renderFA()"></div><div class="field"><label>Available cap</label><input value="$${db.config.salaryCap}" disabled></div></div>${e?`<div class="grid4"><div class="metric"><b>$${e.modelBid}</b><span>Model value bid</span></div><div class="metric"><b>$${e.expected}</b><span>Expected competitive bid</span></div><div class="metric"><b>$${e.maxBid}</b><span>Our hard max</span></div><div class="metric"><b class="${e.zc}">${e.zone}</b><span>Current bid zone</span></div></div><div class="barWrap"><div class="balance"><div class="needle" style="left:${clamp((e.bid/(Math.max(1,e.maxBid*1.3)))*100,3,97)}%"></div></div><div class="barlabels"><span>STEAL</span><span>FAIR/MAX</span><span>OVERPAY</span></div></div><div class="notice"><b>${e.a.name}</b>: projected ${e.a.proj||0} points, ${e.par.toFixed(0)} points above replacement, contract score ${e.contract.toFixed(0)}, Pride value ${fmt(e.mv)}. The max bid rises for scarce starting roles and falls when replacement alternatives are close.</div>`:'<div class="notice">Select a player to generate a bid range.</div>'}</div><div class="card"><h2>Replacement Tree</h2>${e?replacementTree(e.a):'<div class="small">The app will show cheaper alternatives at the same position once a target is selected.</div>'}</div></div><div class="card" style="margin-top:12px"><h2>Free Agent Comparison</h2>${faComparison()}</div>`}
function replacementTree(a){let sims=db.assets.filter(x=>x.type==='PLAYER'&&x.pos===a.pos&&x.id!==a.id).map(x=>({x,ratio:(Number(x.proj)||0)/Math.max(1,Number(a.proj)||1)})).sort((p,q)=>Math.abs(1-p.ratio)-Math.abs(1-q.ratio)).slice(0,4);return sims.length?sims.map((o,i)=>`<div class="gate"><span><b>Fallback ${i+1}: ${o.x.name}</b><br><span class="small">${(o.ratio*100).toFixed(0)}% of target projection · Pride ${fmt(modelValue(o.x))}</span></span><b>${signal(o.x)[0]}</b></div>`).join(''):'<div class="small">Add more players at this position to build replacement options.</div>'}
function faComparison(){return `<div class="tableWrap"><table><thead><tr><th>Player</th><th>Pos</th><th>Proj</th><th>Above repl</th><th>Market</th><th>Pride</th><th>Signal</th></tr></thead><tbody>${db.assets.filter(a=>a.type==='PLAYER').sort((a,b)=>modelValue(b)-modelValue(a)).slice(0,30).map(a=>`<tr><td>${a.name}</td><td>${a.pos}</td><td>${a.proj||0}</td><td>${((a.proj||0)-replacement(a)).toFixed(0)}</td><td>${fmt(a.market)}</td><td>${fmt(modelValue(a))}</td><td class="${signal(a)[1]}">${signal(a)[0]}</td></tr>`).join('')}</tbody></table></div>`}
function prospectValue(p){let posP={QB:1.15,RB:.95,WR:1.08,TE:.82,EDGE:.85,DL:.72,LB:.65,S:.58,CB:.5}[p.pos]||.65;let score=(p.nflDraftCapital*.28+p.production*.24+p.athletic*.12+p.earlyDeclare*.10+p.competition*.10+(100-p.risk)*.16);return Math.round(6200*posP*(score/90)*(1+(100-Math.min(100,p.rank*4))/450))}
function classStrength(year){let ps=db.prospects.filter(p=>Number(p.classYear)===Number(year));if(!ps.length)return 75;let top=ps.slice().sort((a,b)=>a.rank-b.rank).slice(0,12);return clamp(top.reduce((s,p)=>s+prospectValue(p)/80,0)/Math.max(1,top.length))}
function renderDraft(){draft.innerHTML=`<div class="grid"><div class="card"><div class="sectionhead"><h2>Draft Pick Engine</h2><button class="secondary" onclick="addPick()">+ Add pick</button></div>${db.assets.filter(a=>a.type==='PICK').sort((a,b)=>(a.year-b.year)||(a.round-b.round)).map(a=>`<div class="asset"><div class="sectionhead"><b>${a.name}</b><b>${fmt(modelValue(a))}</b></div><div class="grid4"><div class="metric"><b>${a.classStrength||75}</b><span>Class strength</span></div><div class="metric"><b>${a.slotProb?.early||0}%</b><span>Early probability</span></div><div class="metric"><b>${a.liquidity||0}</b><span>Liquidity</span></div><div class="metric"><b>${a.risk||0}</b><span>Risk</span></div></div><button class="ghost" onclick="editAsset('${a.id}')">Edit pick</button></div>`).join('')}</div><div class="card"><div class="sectionhead"><h2>NCAA Prospect Board</h2><button class="secondary" onclick="addProspect()">+ Prospect</button></div>${db.prospects.sort((a,b)=>a.rank-b.rank).map(p=>`<div class="gate"><span><b>#${p.rank} ${p.name}</b> <span class="tag">${p.classYear} ${p.pos}</span><br><span class="small">Draft capital ${p.nflDraftCapital} · Production ${p.production} · Risk ${p.risk}</span></span><b>${fmt(prospectValue(p))}</b></div>`).join('')}</div></div><div class="card" style="margin-top:12px"><h2>Class Outlook</h2><div class="grid3">${[2027,2028,2029].map(y=>`<div class="metric"><b>${classStrength(y).toFixed(0)}</b><span>${y} class strength model</span></div>`).join('')}</div><p class="small">Pick value is not fixed. It moves with projected slot, class quality, top-end positional depth, declaration/draft-capital expectations, liquidity and time-to-realization.</p></div>`}
function addPick(){let year=Number(prompt('Draft year?',2027));if(!year)return;let round=Number(prompt('Round?',1));let band=prompt('Slot band: early, mid, late','mid')||'mid';let name=`${year} ${band[0].toUpperCase()+band.slice(1)} ${round===1?'1st':round===2?'2nd':round===3?'3rd':round+'th'}`;db.assets.push({id:uid('pick'),name,type:'PICK',pos:'PICK',year,round,slotBand:band,market:round===1?5000:round===2?2200:900,classStrength:classStrength(year),slotProb:band==='early'?{early:65,mid:25,late:10}:band==='late'?{early:5,mid:25,late:70}:{early:20,mid:55,late:25},liquidity:round===1?92:70,risk:45,trend:0,source:'Manual'});persist();renderDraft()}

function normalizeArr(x){if(!x)return[];return Array.isArray(x)?x:[x]}
function mflDeepArray(obj, paths){
  for(const path of paths){
    let cur=obj;
    for(const key of path.split('.')) cur=cur?.[key];
    if(cur!==undefined && cur!==null) return normalizeArr(cur);
  }
  return [];
}
function mflHost(){
  let h=(db.mfl.host||'www45.myfantasyleague.com').replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(!h.includes('myfantasyleague.com')) h='www45.myfantasyleague.com';
  return h;
}
function mflUrl(type, extra=''){
  const m=db.mfl;
  return `https://${mflHost()}/${m.year||2026}/export?TYPE=${encodeURIComponent(type)}&L=${encodeURIComponent(m.leagueId||'29218')}&JSON=1${extra}${m.apiKey?'&APIKEY='+encodeURIComponent(m.apiKey):''}`;
}
async function mflFetch(type,extra=''){
  if(!db.mfl.leagueId) throw new Error('League ID is missing.');
  const res=await fetch(mflUrl(type,extra),{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',headers:{'Accept':'application/json,text/plain,*/*'}});
  if(!res.ok) throw new Error(`${type}: HTTP ${res.status}`);
  const txt=await res.text();
  try{return JSON.parse(txt)}
  catch(e){throw new Error(`${type}: MFL did not return JSON. ${txt.slice(0,120).replace(/\s+/g,' ')}`)}
}

function mflPlayerName(p){
  if(!p)return'';
  if(p.name)return p.name;
  return `${p.firstname||p.firstName||''} ${p.lastname||p.lastName||''}`.trim();
}
function safeNum(v){
  if(v===undefined||v===null||v==='')return undefined;
  const n=Number(String(v).replace(/[$,]/g,''));
  return Number.isFinite(n)?n:undefined;
}
function mergeMFLAsset(p,rp,franchiseName){
  const pid=String(rp?.id||p?.id||'');
  const name=mflPlayerName(p)||rp?.name||pid;
  if(!pid&&!name)return null;
  let hit=db.assets.find(a=>String(a.mflId||'')===pid) ||
          db.assets.find(a=>String(a.name||'').toLowerCase()===String(name).toLowerCase());
  if(!hit){
    hit={id:uid('mfl'),mflId:pid,name,type:'PLAYER',
      pos:String(p?.position||p?.pos||rp?.position||'').toUpperCase(),
      nfl:p?.team||rp?.team||'',age:0,market:1000,adp:0,ecr:0,proj:0,ppg:0,
      role:50,trend:0,risk:45,liquidity:50,salary:0,years:0,
      roster:franchiseName||'FREE AGENT',source:'MFL sync'};
    db.assets.push(hit);
  }
  const old=modelValue(hit);
  hit.mflId=pid||hit.mflId;
  hit.name=name||hit.name;
  hit.pos=String(p?.position||p?.pos||hit.pos||'').toUpperCase();
  hit.nfl=p?.team||hit.nfl||'';
  hit.roster=franchiseName||'FREE AGENT';
  const sal=safeNum(rp?.salary ?? rp?.sal);
  const yrs=safeNum(rp?.contractYear ?? rp?.contractYears ?? rp?.contract ?? rp?.years);
  if(sal!==undefined)hit.salary=sal;
  if(yrs!==undefined)hit.years=yrs;
  hit.source=(hit.source&&hit.source!=='Manual seed')?hit.source:'MFL + local model';
  hit.lastReason='MFL league sync';
  recordHistory(hit,old);
  return hit;
}
function parseMFLTransactions(obj,franchiseMap,playerMap){
  return mflDeepArray(obj,['transactions.transaction','transaction']).map(t=>{
    const fid=String(t.franchise||t.franchise_id||'');
    const pid=String(t.player||t.player_id||'');
    return {timestamp:t.timestamp||t.date||t.time||'',type:t.type||t.transaction_type||'',
      franchise:franchiseMap[fid]||fid,
      player:mflPlayerName(playerMap[pid])||pid,raw:t};
  });
}

async function proxyFetch(path){
  ensureMFLDefaults();
  let base=(db.mfl.proxyUrl||'').trim().replace(/\/$/,'');
  if(!base) throw new Error('Cloudflare Worker URL is not set yet.');
  const res=await fetch(base+path,{method:'GET',mode:'cors',cache:'no-store',headers:{'Accept':'application/json'}});
  let payload;
  try{payload=await res.json()}catch(e){throw new Error(`Sync service returned HTTP ${res.status} without JSON.`)}
  if(!res.ok || payload?.ok===false) throw new Error(payload?.error||`Sync service HTTP ${res.status}`);
  return payload;
}

async function syncMFL(){
  ensureMFLDefaults();
  const el=document.getElementById('syncStatus');
  el.innerHTML='Securely syncing <b>Pride LG 29218</b> through the Worker…';
  try{
    const bundle=await proxyFetch('/sync');
    const league=bundle.data?.league||{};
    const players=bundle.data?.players||{};
    const rosters=bundle.data?.rosters||{};
    const standings=bundle.data?.standings||{};
    const transactions=bundle.data?.transactions||{};
    const draftResults=bundle.data?.draftResults||{};
    const futureDraftPicks=bundle.data?.futureDraftPicks||{};

    const franchises=mflDeepArray(league,['league.franchises.franchise','franchises.franchise']);
    const franchiseMap={};
    franchises.forEach(f=>{
      const id=String(f.id||f.franchise_id||'');
      franchiseMap[id]=f.name||f.owner_name||id;
    });

    const plist=mflDeepArray(players,['players.player','player']);
    const playerMap={};
    plist.forEach(p=>{if(p?.id!==undefined)playerMap[String(p.id)]=p});

    const rosterArr=mflDeepArray(rosters,['rosters.franchise','franchise']);
    const owned=new Set();
    for(const fr of rosterArr){
      const fid=String(fr.id||fr.franchise_id||'');
      const fname=franchiseMap[fid]||fid||'Unknown franchise';
      for(const rp of normalizeArr(fr.player)){
        const pid=String(rp?.id||'');
        if(pid)owned.add(pid);
        mergeMFLAsset(playerMap[pid]||{},rp,fname);
      }
    }

    let freeAgents=0;
    for(const p of plist){
      const pid=String(p?.id||'');
      if(!pid||owned.has(pid))continue;
      const pos=String(p.position||p.pos||'').toUpperCase();
      if(!['QB','RB','WR','TE','PK','K','DL','DE','DT','EDGE','LB','CB','S','DB'].includes(pos))continue;
      const hit=db.assets.find(a=>String(a.mflId||'')===pid);
      if(hit)hit.roster='FREE AGENT';
      else mergeMFLAsset(p,{id:pid},'FREE AGENT');
      freeAgents++;
    }

    db.mfl.standings=mflDeepArray(standings,['leagueStandings.franchise','standings.franchise','franchise']).map(s=>{
      const fid=String(s.id||s.franchise_id||'');
      return {franchise:franchiseMap[fid]||fid,wins:s.h2hw||s.wins||s.w||0,
        losses:s.h2hl||s.losses||s.l||0,points:s.pf||s.points_for||s.points||0,raw:s};
    });
    db.mfl.transactions=parseMFLTransactions(transactions,franchiseMap,playerMap);
    
    db.mfl.draftResults=mflDeepArray(draftResults,['draftResults.draftUnit.draftPick','draftResults.draftPick','draftPick']);

    // Best-effort future pick ownership ingestion. MFL's exact nesting can vary by league/year.
    const pickRows=mflDeepArray(futureDraftPicks,[
      'futureDraftPicks.franchise',
      'futureDraftPicks.futureDraftPick',
      'futureDraftPicks.draftPick',
      'franchise',
      'futureDraftPick',
      'draftPick'
    ]);
    if(pickRows.length){
      // Remove only prior MFL-generated future picks so a refresh does not duplicate them.
      db.assets=db.assets.filter(a=>!(a.type==='PICK' && a.source==='MFL future picks'));
      const seen=new Set();
      function addPick(owner,year,round,slotLabel=''){
        owner=franchiseMap[String(owner)]||owner||'';
        year=Number(year)||2027; round=Number(round)||1;
        const key=`${owner}|${year}|${round}|${slotLabel}`;
        if(!owner||seen.has(key))return; seen.add(key);
        const name=`${year} ${slotLabel?slotLabel+' ':''}${round===1?'1st':round===2?'2nd':round===3?'3rd':round+'th'}`.replace(/\s+/g,' ').trim();
        db.assets.push({
          id:uid('pick'),name,type:'PICK',pos:'PICK',roster:owner,year,round,
          market:round===1?5200:round===2?2400:round===3?1000:500,
          classStrength:80,slot:slotLabel||'MID',trend:0,risk:35,liquidity:90,
          salary:0,years:0,proj:0,role:70,source:'MFL future picks',lastReason:'MFL future pick sync'
        });
      }
      pickRows.forEach(row=>{
        const owner=row.franchise_id||row.franchise||row.owner||row.id;
        const nested=normalizeArr(row.pick||row.draftPick||row.futureDraftPick);
        if(nested.length){
          nested.forEach(p=>addPick(owner,p.year||p.season,p.round,p.slot||p.position||''));
        }else{
          addPick(owner,row.year||row.season,row.round,row.slot||row.position||'');
        }
      });
    }

    db.mfl.franchises=franchises.map(f=>({id:String(f.id||f.franchise_id||''),name:f.name||f.owner_name||String(f.id||'')}));

    if(league?.league?.name)db.config.leagueName=league.league.name;
    const carnage=db.mfl.franchises.find(f=>/capitol carnage/i.test(f.name));
    if(carnage)db.config.teamName=carnage.name;

    db.mfl.lastCounts={franchises:db.mfl.franchises.length,rostered:owned.size,freeAgents,
      transactions:db.mfl.transactions.length,indexedPlayers:plist.length};
    db.lastSync=bundle.syncedAt||new Date().toISOString();
    persist();renderAssetList();renderSync();

    const out=document.getElementById('syncStatus');
    if(out)out.innerHTML=`<span class="good">SYNC COMPLETE</span> · ${new Date(db.lastSync).toLocaleString()} · ${db.mfl.lastCounts.franchises} franchises · ${db.mfl.lastCounts.rostered} rostered · ${db.mfl.lastCounts.indexedPlayers} MFL players indexed`;
  }catch(err){
    el.innerHTML=`<span class="bad">SYNC FAILED:</span> ${err.message}`;
  }
}

function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`capitol-carnage-gm-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.assets||!x.config)throw Error('Invalid backup');db=x;persist();renderAssetList();showView('dashboard');alert('Backup restored.')}catch(e){alert('Could not restore: '+e.message)}};r.readAsText(file)}
function downloadCSV(){let cols=['name','type','pos','roster','market','adp','ecr','proj','age','role','trend','risk','liquidity','salary','years'];let rows=[cols.join(','),...db.assets.map(a=>cols.map(k=>JSON.stringify(a[k]??'')).join(','))];let b=new Blob([rows.join('\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ccgm-market-board.csv';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Erase local app data and return to seed database?')){localStorage.removeItem('ccgm_db');db=loadDB();renderAssetList();showView('dashboard')}}
function renderAssetList(){document.getElementById('assetList').innerHTML=db.assets.map(a=>`<option value="${a.name}">`).join('')}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');

async function autoRefreshMFL(){
  try{
    ensureMFLDefaults();
    if(!db.mfl.proxyUrl) return;
    const last=db.lastSync?new Date(db.lastSync).getTime():0;
    const stale=!last || (Date.now()-last)>6*60*60*1000;
    if(stale){
      await syncMFL();
      if(localStorage.getItem('ccgm_view')==='trade') renderTrade();
    }
  }catch(e){console.warn('Background MFL refresh skipped',e)}
}

ensureMFLDefaults();persist();nav();renderAssetList();cset('leagueName',db.config.leagueName);let initial=localStorage.getItem('ccgm_view')||'dashboard';showView(initial);setTimeout(autoRefreshMFL,800);
</script>
