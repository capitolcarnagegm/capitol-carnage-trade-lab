function clone(x){return JSON.parse(JSON.stringify(x))}
let db=loadDB();
function loadDB(){try{const x=JSON.parse(localStorage.getItem('ccgm_db'));if(x&&x.assets)return x}catch(e){}return {config:clone(DEFAULT_CONFIG),assets:clone(seedAssets),prospects:clone(seedProspects),history:[],savedTrades:[],savedFA:[],lastSync:null,mfl:{host:'api.myfantasyleague.com',year:2026,leagueId:'',apiKey:''}}}
function persist(){localStorage.setItem('ccgm_db',JSON.stringify(db))}
function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,Number(n)||0))}
function fmt(n){return Math.round(Number(n)||0).toLocaleString()}
function pct(n){return ((Number(n)||0)*100).toFixed(1)+'%'}
function posScarcity(pos){let base={QB:94,RB:80,WR:76,TE:88,EDGE:91,DL:84,LB:77,S:70,CB:58,PICK:78}[pos]||70;if(pos==='QB'&&db.config.superflex)base+=5;if(pos==='TE'&&db.config.tep)base+=5;if((pos==='EDGE'||pos==='DL')&&db.config.sackPremium)base+=6;return clamp(base)}
function ageScore(a){if(!a||a.type==='PICK')return 82;let peak={QB:29,RB:24,WR:26,TE:27,EDGE:27,DL:27,LB:26,S:27,CB:26}[a.pos]||26;let dist=Math.abs((a.age||peak)-peak);return clamp(96-dist*6)}
function replacement(a){return Number(db.config.replacement[a.pos]||0)}
function projectionScore(a){if(a.type==='PICK')return clamp((a.classStrength||75)*.82 + pickSlotScore(a)*.18);let repl=replacement(a);let above=(Number(a.proj)||0)-repl;return clamp(60+above/2.2)}
function pickSlotScore(a){let p=a.slotProb||{};return clamp((p.early||0)*1+(p.mid||0)*.78+(p.late||0)*.58)}
function contractScore(a){if(a.type==='PICK')return 91;if(a.salary===undefined||a.salary==='')return 70;let cap=db.config.salaryCap||1000;let salPct=(Number(a.salary)||0)/cap;let control=Math.min(5,Number(a.years)||0);let prod=projectionScore(a);return clamp(68+prod*.25-salPct*170+control*4.5)}
function roleScore(a){if(a.type==='PICK')return clamp((a.classStrength||75)*.75+pickSlotScore(a)*.25);return clamp(a.role||60)}
function marketScore(a){let m=Number(a.market)||0;return clamp(45+Math.log10(Math.max(1,m))*13)}
function trendScore(a){return clamp(70+(Number(a.trend)||0)*2.2)}
function riskScore(a){return clamp(100-(Number(a.risk)||35))}
function liquidityScore(a){return clamp(a.liquidity||65)}
function arbitrage(a){if(a.type==='PICK')return (modelValue(a)-(Number(a.market)||0))/Math.max(1,Number(a.market)||1);let adpEdge=(a.adp&&a.ecr)?(Number(a.adp)-Number(a.ecr))/Math.max(20,Number(a.adp)):0;let projEdge=(projectionScore(a)-marketScore(a))/100;return adpEdge*.35+projEdge*.65}
function prideScore(a){const w=db.config.weights;return clamp(marketScore(a)*w.market+projectionScore(a)*w.projection+roleScore(a)*w.replacement+contractScore(a)*w.contract+ageScore(a)*w.age+roleScore(a)*w.role+trendScore(a)*w.trend+posScarcity(a.pos)*w.scarcity+liquidityScore(a)*w.liquidity+riskScore(a)*w.risk)}
function pickMultiplier(a){let yearDisc=Math.max(.72,1-(Math.max(0,(Number(a.year)||2027)-2027)*.08));let roundMult={1:1,2:.62,3:.32,4:.16}[a.round]||.12;let cls=(Number(a.classStrength)||75)/85;let slot=(pickSlotScore(a)/78);return yearDisc*roundMult*cls*slot}
function modelValue(a){let base=Number(a.market)||0;if(a.type==='PICK'){let anchor=a.round===1?5400:a.round===2?2500:a.round===3?1100:600;return Math.round((base*.45+anchor*pickMultiplier(a)*.55)*(1+(Number(a.trend)||0)/100))}let score=prideScore(a);let proj=projectionScore(a);let contract=contractScore(a);let arb=arbitrage(a);return Math.max(50,Math.round(base*(.58+score/215)*(1+arb*.12)*(1+(contract-70)/420)*(1+(proj-70)/500)))}
function titleImpact(a){if(a.type==='PICK')return clamp(55+(a.year===2027?10:0));return clamp(projectionScore(a)*.55+roleScore(a)*.25+posScarcity(a.pos)*.2)}
function prongs(a){return {Production:projectionScore(a),'Roster Fit':clamp((titleImpact(a)+posScarcity(a.pos))/2),'Market Timing':trendScore(a),'Contract Value':contractScore(a),'Championship Impact':titleImpact(a),'Cap Leverage':clamp(contractScore(a)*.72+liquidityScore(a)*.28),'Outside Market':liquidityScore(a)}}
function signal(a){let ar=arbitrage(a);let mv=modelValue(a),m=Number(a.market)||1;let edge=(mv-m)/m;if(edge>.18&&Number(a.trend)>=0)return ['STRONG BUY','good'];if(edge>.07)return ['BUY','good'];if(edge<-.18)return ['SELL HIGH','bad'];if(edge<-.07)return ['SHOP','warn'];if(Number(a.trend)<-6)return ['FALLING','bad'];return ['HOLD','blue']}
function recordHistory(asset,oldValue){let nv=modelValue(asset);if(oldValue&&Math.abs(nv-oldValue)/oldValue<.01)return;db.history.unshift({id:uid('hist'),assetId:asset.id,name:asset.name,date:new Date().toISOString(),oldValue:oldValue||nv,newValue:nv,reason:asset.lastReason||'Data/model update'});db.history=db.history.slice(0,300)}
function nav(){const tabs=[['dashboard','War Room'],['trade','Trade Lab'],['fa','Free Agency'],['draft','Draft & Picks'],['market','Market Board'],['sync','MFL Sync'],['settings','Settings']];document.getElementById('nav').innerHTML=tabs.map(([id,l])=>`<button data-view="${id}" onclick="showView('${id}')">${l}</button>`).join('')}
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));renderView(id);localStorage.setItem('ccgm_view',id)}
function renderView(id){({dashboard:renderDashboard,trade:renderTrade,fa:renderFA,draft:renderDraft,market:renderMarket,sync:renderSync,settings:renderSettings}[id]||renderDashboard)()}
function dashboardCards(){let mine=db.assets.filter(a=>a.roster===db.config.teamName&&a.type==='PLAYER');let total=mine.reduce((s,a)=>s+modelValue(a),0);let proj=mine.reduce((s,a)=>s+(Number(a.proj)||0),0);let cap=mine.reduce((s,a)=>s+(Number(a.salary)||0),0);let buys=db.assets.filter(a=>signal(a)[0].includes('BUY')).length;return {mine,total,proj,cap,buys}}
function renderDashboard(){let x=dashboardCards();let movers=db.history.slice(0,6);let buys=db.assets.slice().sort((a,b)=>arbitrage(b)-arbitrage(a)).slice(0,5);dashboard.innerHTML=`<div class="grid4"><div class="metric"><b>${fmt(x.total)}</b><span>Roster Pride value</span></div><div class="metric"><b>${fmt(x.proj)}</b><span>Projected points on roster</span></div><div class="metric"><b>$${x.cap.toFixed(2)}</b><span>Known active salary</span></div><div class="metric"><b>${x.buys}</b><span>Current buy signals</span></div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="sectionhead"><h2>Best Market Inefficiencies</h2><span class="pill">Model vs market</span></div>${buys.map(a=>assetMini(a)).join('')}</div><div class="card"><div class="sectionhead"><h2>Recent Value Movement</h2><span class="pill">History</span></div>${movers.length?movers.map(h=>`<div class="gate"><span><b>${h.name}</b><br><span class="small">${h.reason}</span></span><b class="${h.newValue>=h.oldValue?'good':'bad'}">${h.newValue>=h.oldValue?'+':''}${fmt(h.newValue-h.oldValue)}</b></div>`).join(''):'<div class="notice">Value changes will appear here as you edit players, sync the league or update projections/ADP.</div>'}</div></div><div class="card" style="margin-top:12px"><h2>GM Philosophy</h2><div class="small">The app separates public market price from our calculated football value. The goal is not to predict every breakout; it is to repeatedly buy production, cap efficiency and appreciating assets below the market price and sell expensive assets when the market outruns the underlying football value.</div></div>`}
function assetMini(a){let s=signal(a),mv=modelValue(a),edge=(mv-(Number(a.market)||0))/Math.max(1,Number(a.market)||1);return `<div class="gate"><span><b>${a.name}</b> <span class="tag">${a.pos}</span><br><span class="small">Market ${fmt(a.market)} · Pride ${fmt(mv)} · ${pct(edge)} mispricing</span></span><b class="${s[1]}">${s[0]}</b></div>`}
let tradeState={receive:[],give:[],lens:'overall'};
function addTrade(side){tradeState[side].push({assetId:'',salaryOverride:'',yearsOverride:''});renderTrade()}
function removeTrade(side,i){tradeState[side].splice(i,1);renderTrade()}
function tradeAsset(obj){let a=db.assets.find(x=>x.id===obj.assetId);if(!a)return null;a=clone(a);if(obj.salaryOverride!=='')a.salary=Number(obj.salaryOverride);if(obj.yearsOverride!=='')a.years=Number(obj.yearsOverride);return a}
function sideValue(side,lens='overall'){return tradeState[side].reduce((s,o)=>{let a=tradeAsset(o);if(!a)return s;if(lens==='market')return s+(Number(a.market)||0);if(lens==='points')return s+(Number(a.proj)||0)*20;if(lens==='contract')return s+contractScore(a)*70;if(lens==='title')return s+titleImpact(a)*75;if(lens==='future')return s+(a.type==='PICK'?modelValue(a):modelValue(a)*(ageScore(a)/100));return s+modelValue(a)},0)}
function sideAvgProng(side,k){let arr=tradeState[side].map(tradeAsset).filter(Boolean);return arr.length?arr.reduce((s,a)=>s+prongs(a)[k],0)/arr.length:0}
function tradeRows(side){if(!tradeState[side].length)return `<div class="notice">Add players or picks to this side.</div>`;return tradeState[side].map((o,i)=>{let a=tradeAsset(o);return `<div class="asset"><div class="assetrow"><div class="field"><label>Asset</label><select onchange="tradeState.${side}[${i}].assetId=this.value;renderTrade()"><option value="">Select asset</option>${assetOptions(o.assetId)}</select></div><div class="field"><label>Salary override</label><input type="number" step=".01" value="${o.salaryOverride}" placeholder="${a?.salary??''}" onchange="tradeState.${side}[${i}].salaryOverride=this.value;renderTrade()"></div><div class="field"><label>Years</label><input type="number" value="${o.yearsOverride}" placeholder="${a?.years??''}" onchange="tradeState.${side}[${i}].yearsOverride=this.value;renderTrade()"></div></div>${a?`<div class="assetmetrics"><div class="metric"><b>${fmt(a.market)}</b><span>Market</span></div><div class="metric"><b>${fmt(modelValue(a))}</b><span>Pride value</span></div><div class="metric"><b>${a.proj??'—'}</b><span>Projected pts</span></div><div class="metric"><b>${contractScore(a).toFixed(0)}</b><span>Contract score</span></div></div>`:''}<button class="danger" onclick="removeTrade('${side}',${i})">Remove</button></div>`}).join('')}
function assetOptions(sel){return db.assets.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.name} · ${a.pos}${a.roster?' · '+a.roster:''}</option>`).join('')}
function tradeAnalysis(){let lens=tradeState.lens,r=sideValue('receive',lens),g=sideValue('give',lens),edge=g?(r-g)/g:0;let needle=clamp(50-edge*110,5,95);let prongKeys=['Production','Roster Fit','Market Timing','Contract Value','Championship Impact','Cap Leverage','Outside Market'];let pass=0;let prongRows=prongKeys.map(k=>{let rv=sideAvgProng('receive',k),gv=sideAvgProng('give',k),p=rv>=db.config.threshold;pass+=p?1:0;return `<div class="gate"><span><b>${k}</b><br><span class="small">Receive ${rv.toFixed(0)} vs Give ${gv.toFixed(0)}</span></span><b class="${p?'good':'bad'}">${p?'PASS':'FAIL'} ${rv>=gv?'▲':'▼'}</b></div>`}).join('');let gates=[r>=g*.95,sideAvgProng('receive','Roster Fit')>=sideAvgProng('give','Roster Fit'),sideAvgProng('receive','Contract Value')>=sideAvgProng('give','Contract Value')-5,sideAvgProng('receive','Outside Market')>=sideAvgProng('give','Outside Market')-5];let gc=gates.filter(Boolean).length;let majority=pass>=db.config.requiredProngs,hard=gc>=db.config.hardReq;let grade=edge>=.18?'A+':edge>=.12?'A':edge>=.07?'A-':edge>=.03?'B+':edge>=0?'B':edge>=-.04?'B-':edge>=-.08?'C+':'C';let verdict=!g?'ENTER TRADE':(majority&&hard&&edge>=-.04?(edge>=.12?'SMASH ACCEPT':edge>=.03?'ACCEPT':'APPROVE'):(edge>=-.08?'RENEGOTIATE':'REJECT'));let vc=verdict.includes('ACCEPT')||verdict==='APPROVE'?'vgood':verdict==='REJECT'?'vbad':'vwarn';return {r,g,edge,needle,prongRows,gates,gc,majority,hard,grade,verdict,vc}}
function renderTrade(){let a=tradeAnalysis();trade.innerHTML=`<div class="grid"><div class="card"><div class="sectionhead"><h2>${db.config.teamName} RECEIVES</h2><span class="pill">${fmt(a.r)}</span></div>${tradeRows('receive')}<button class="secondary" onclick="addTrade('receive')">+ Add asset</button></div><div class="card"><div class="sectionhead"><h2>${db.config.teamName} GIVES</h2><span class="pill">${fmt(a.g)}</span></div>${tradeRows('give')}<button class="secondary" onclick="addTrade('give')">+ Add asset</button></div></div><div class="card" style="margin-top:12px"><div class="sectionhead"><h2>Trade Balance Meter</h2><select style="width:auto" onchange="tradeState.lens=this.value;renderTrade()"><option value="overall" ${tradeState.lens==='overall'?'selected':''}>Overall Pride Value</option><option value="market" ${tradeState.lens==='market'?'selected':''}>Market / ADP</option><option value="points" ${tradeState.lens==='points'?'selected':''}>Projected Points</option><option value="contract" ${tradeState.lens==='contract'?'selected':''}>Contract & Cap</option><option value="title" ${tradeState.lens==='title'?'selected':''}>Championship Impact</option><option value="future" ${tradeState.lens==='future'?'selected':''}>Future / Draft Capital</option></select></div><div class="grid4"><div class="metric"><b>${fmt(a.r)}</b><span>Receive</span></div><div class="metric"><b>${fmt(a.g)}</b><span>Give</span></div><div class="metric"><b class="${a.edge>=0?'good':'bad'}">${a.edge>=0?'+':''}${pct(a.edge)}</b><span>Value tilt</span></div><div class="metric"><b>${a.grade}</b><span>Grade</span></div></div><div class="barWrap"><div class="balance"><div class="needle" style="left:${a.needle}%"></div></div><div class="acceptable"></div><div class="barlabels"><span>CAP CARNAGE WIN</span><span>FAIR</span><span>OTHER SIDE WIN</span></div></div><div class="${'verdict '+a.vc}">${a.verdict}</div></div><div class="grid" style="margin-top:12px"><div class="card"><h2>7-Prong Majority Test</h2>${a.prongRows}<div class="gate"><span><b>Majority</b></span><b class="${a.majority?'good':'bad'}">${a.majority?'PASS':'FAIL'}</b></div></div><div class="card"><h2>4 Hard Value Gates</h2>${['Receive ≥95% adjusted value','Roster construction improves/holds','Contract/cap remains defensible','Outside-market liquidity holds'].map((x,i)=>`<div class="gate"><span>${x}</span><b class="${a.gates[i]?'good':'bad'}">${a.gates[i]?'PASS':'FAIL'}</b></div>`).join('')}<div class="gate"><span><b>Hard Gate</b></span><b class="${a.hard?'good':'bad'}">${a.gc}/4 ${a.hard?'PASS':'FAIL'}</b></div><button onclick="saveTrade()">Save Analysis</button></div></div>`}
function saveTrade(){db.savedTrades.unshift({id:uid('trade'),date:new Date().toISOString(),state:clone(tradeState),analysis:tradeAnalysis()});db.savedTrades=db.savedTrades.slice(0,50);persist();alert('Trade saved on this device.')}
let faState={assetId:'',bid:0,years:3};
function faEval(){let a=db.assets.find(x=>x.id===faState.assetId);if(!a)return null;a=clone(a);a.salary=Number(faState.bid)||0;a.years=Number(faState.years)||1;let mv=modelValue(a),baseProj=Number(a.proj)||0,repl=replacement(a),par=Math.max(0,baseProj-repl),contract=contractScore(a);let rawMax=Math.max(1,(mv/900)+(par/11)+(posScarcity(a.pos)-70)/5+(a.role-70)/7+(Math.max(0,a.trend||0))/3);let maxBid=Math.min(db.config.salaryCap*.16,Math.round(rawMax));let modelBid=Math.max(1,Math.round(maxBid*.76));let expected=Math.round(maxBid*.9);let bid=Number(faState.bid)||0;let zone=bid<=modelBid*.65?'STEAL':bid<=modelBid?'BUY':bid<=maxBid?'ACCEPTABLE':bid<=maxBid*1.18?'AGGRESSIVE':'PASS';let zc=zone==='STEAL'||zone==='BUY'?'good':zone==='PASS'?'bad':'warn';return {a,mv,par,contract,maxBid,modelBid,expected,bid,zone,zc}}
function renderFA(){let e=faEval();fa.innerHTML=`<div class="grid"><div class="card"><h2>Free Agency Value Checker</h2><div class="field"><label>Player</label><select onchange="faState.assetId=this.value;renderFA()"><option value="">Select player</option>${db.assets.filter(a=>a.type==='PLAYER').map(a=>`<option value="${a.id}" ${faState.assetId===a.id?'selected':''}>${a.name} · ${a.pos}</option>`).join('')}</select></div><div class="grid3"><div class="field"><label>Your contemplated bid</label><input type="number" value="${faState.bid}" oninput="faState.bid=Number(this.value);renderFA()"></div><div class="field"><label>Contract years</label><input type="number" value="${faState.years}" oninput="faState.years=Number(this.value);renderFA()"></div><div class="field"><label>Available cap</label><input value="$${db.config.salaryCap}" disabled></div></div>${e?`<div class="grid4"><div class="metric"><b>$${e.modelBid}</b><span>Model value bid</span></div><div class="metric"><b>$${e.expected}</b><span>Expected competitive bid</span></div><div class="metric"><b>$${e.maxBid}</b><span>Our hard max</span></div><div class="metric"><b class="${e.zc}">${e.zone}</b><span>Current bid zone</span></div></div><div class="barWrap"><div class="balance"><div class="needle" style="left:${clamp((e.bid/(Math.max(1,e.maxBid*1.3)))*100,3,97)}%"></div></div><div class="barlabels"><span>STEAL</span><span>FAIR/MAX</span><span>OVERPAY</span></div></div><div class="notice"><b>${e.a.name}</b>: projected ${e.a.proj||0} points, ${e.par.toFixed(0)} points above replacement, contract score ${e.contract.toFixed(0)}, Pride value ${fmt(e.mv)}. The max bid rises for scarce starting roles and falls when replacement alternatives are close.</div>`:'<div class="notice">Select a player to generate a bid range.</div>'}</div><div class="card"><h2>Replacement Tree</h2>${e?replacementTree(e.a):'<div class="small">The app will show cheaper alternatives at the same position once a target is selected.</div>'}</div></div><div class="card" style="margin-top:12px"><h2>Free Agent Comparison</h2>${faComparison()}</div>`}
function replacementTree(a){let sims=db.assets.filter(x=>x.type==='PLAYER'&&x.pos===a.pos&&x.id!==a.id).map(x=>({x,ratio:(Number(x.proj)||0)/Math.max(1,Number(a.proj)||1)})).sort((p,q)=>Math.abs(1-p.ratio)-Math.abs(1-q.ratio)).slice(0,4);return sims.length?sims.map((o,i)=>`<div class="gate"><span><b>Fallback ${i+1}: ${o.x.name}</b><br><span class="small">${(o.ratio*100).toFixed(0)}% of target projection · Pride ${fmt(modelValue(o.x))}</span></span><b>${signal(o.x)[0]}</b></div>`).join(''):'<div class="small">Add more players at this position to build replacement options.</div>'}
function faComparison(){return `<div class="tableWrap"><table><thead><tr><th>Player</th><th>Pos</th><th>Proj</th><th>Above repl</th><th>Market</th><th>Pride</th><th>Signal</th></tr></thead><tbody>${db.assets.filter(a=>a.type==='PLAYER').sort((a,b)=>modelValue(b)-modelValue(a)).slice(0,30).map(a=>`<tr><td>${a.name}</td><td>${a.pos}</td><td>${a.proj||0}</td><td>${((a.proj||0)-replacement(a)).toFixed(0)}</td><td>${fmt(a.market)}</td><td>${fmt(modelValue(a))}</td><td class="${signal(a)[1]}">${signal(a)[0]}</td></tr>`).join('')}</tbody></table></div>`}
function prospectValue(p){let posP={QB:1.15,RB:.95,WR:1.08,TE:.82,EDGE:.85,DL:.72,LB:.65,S:.58,CB:.5}[p.pos]||.65;let score=(p.nflDraftCapital*.28+p.production*.24+p.athletic*.12+p.earlyDeclare*.10+p.competition*.10+(100-p.risk)*.16);return Math.round(6200*posP*(score/90)*(1+(100-Math.min(100,p.rank*4))/450))}
function classStrength(year){let ps=db.prospects.filter(p=>Number(p.classYear)===Number(year));if(!ps.length)return 75;let top=ps.slice().sort((a,b)=>a.rank-b.rank).slice(0,12);return clamp(top.reduce((s,p)=>s+prospectValue(p)/80,0)/Math.max(1,top.length))}
function renderDraft(){draft.innerHTML=`<div class="grid"><div class="card"><div class="sectionhead"><h2>Draft Pick Engine</h2><button class="secondary" onclick="addPick()">+ Add pick</button></div>${db.assets.filter(a=>a.type==='PICK').sort((a,b)=>(a.year-b.year)||(a.round-b.round)).map(a=>`<div class="asset"><div class="sectionhead"><b>${a.name}</b><b>${fmt(modelValue(a))}</b></div><div class="grid4"><div class="metric"><b>${a.classStrength||75}</b><span>Class strength</span></div><div class="metric"><b>${a.slotProb?.early||0}%</b><span>Early probability</span></div><div class="metric"><b>${a.liquidity||0}</b><span>Liquidity</span></div><div class="metric"><b>${a.risk||0}</b><span>Risk</span></div></div><button class="ghost" onclick="editAsset('${a.id}')">Edit pick</button></div>`).join('')}</div><div class="card"><div class="sectionhead"><h2>NCAA Prospect Board</h2><button class="secondary" onclick="addProspect()">+ Prospect</button></div>${db.prospects.sort((a,b)=>a.rank-b.rank).map(p=>`<div class="gate"><span><b>#${p.rank} ${p.name}</b> <span class="tag">${p.classYear} ${p.pos}</span><br><span class="small">Draft capital ${p.nflDraftCapital} · Production ${p.production} · Risk ${p.risk}</span></span><b>${fmt(prospectValue(p))}</b></div>`).join('')}</div></div><div class="card" style="margin-top:12px"><h2>Class Outlook</h2><div class="grid3">${[2027,2028,2029].map(y=>`<div class="metric"><b>${classStrength(y).toFixed(0)}</b><span>${y} class strength model</span></div>`).join('')}</div><p class="small">Pick value is not fixed. It moves with projected slot, class quality, top-end positional depth, declaration/draft-capital expectations, liquidity and time-to-realization.</p></div>`}
function addPick(){let year=Number(prompt('Draft year?',2027));if(!year)return;let round=Number(prompt('Round?',1));let band=prompt('Slot band: early, mid, late','mid')||'mid';let name=`${year} ${band[0].toUpperCase()+band.slice(1)} ${round===1?'1st':round===2?'2nd':round===3?'3rd':round+'th'}`;db.assets.push({id:uid('pick'),name,type:'PICK',pos:'PICK',year,round,slotBand:band,market:round===1?5000:round===2?2200:900,classStrength:classStrength(year),slotProb:band==='early'?{early:65,mid:25,late:10}:band==='late'?{early:5,mid:25,late:70}:{early:20,mid:55,late:25},liquidity:round===1?92:70,risk:45,trend:0,source:'Manual'});persist();renderDraft()}
function addProspect(){let name=prompt('Prospect name');if(!name)return;let pos=(prompt('Position','WR')||'WR').toUpperCase();let classYear=Number(prompt('Draft class year',2027));let rank=Number(prompt('Current class rank',10));db.prospects.push({id:uid('pros'),name,pos,classYear,age:20,rank,nflDraftCapital:75,production:75,athletic:75,earlyDeclare:75,competition:75,risk:40,notes:''});persist();renderDraft()}
let marketFilter='';
function renderMarket(){let rows=db.assets.filter(a=>a.name.toLowerCase().includes(marketFilter.toLowerCase())).sort((a,b)=>modelValue(b)-modelValue(a));market.innerHTML=`<div class="card"><div class="sectionhead"><h2>Dynamic Market Board</h2><button onclick="newAsset()">+ Add Asset</button></div><div class="searchline"><input placeholder="Search players, picks, prospects…" value="${marketFilter}" oninput="marketFilter=this.value;renderMarket()"><select onchange="sortMarket(this.value)"><option>Sort: Pride value</option><option value="trend">Trend</option><option value="arb">Mispricing</option></select><button class="secondary" onclick="document.getElementById('csvImport').click()">Import CSV</button><input id="csvImport" hidden type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Asset</th><th>Pos</th><th>Roster</th><th>ADP</th><th>ECR</th><th>Proj</th><th>Salary</th><th>Market</th><th>Pride</th><th>Trend</th><th>Signal</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${a.name}</b><br><span class="small">${a.source||''}</span></td><td>${a.pos}</td><td>${a.roster||'FA / Pick'}</td><td>${a.adp||'—'}</td><td>${a.ecr||'—'}</td><td>${a.proj||'—'}</td><td>${a.salary!==undefined?'$'+a.salary:'—'}</td><td>${fmt(a.market)}</td><td><b>${fmt(modelValue(a))}</b></td><td class="${(a.trend||0)>=0?'good':'bad'}">${(a.trend||0)>0?'+':''}${a.trend||0}</td><td class="${signal(a)[1]}">${signal(a)[0]}</td><td><button class="ghost" onclick="editAsset('${a.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function sortMarket(v){if(v==='trend')db.assets.sort((a,b)=>(b.trend||0)-(a.trend||0));if(v==='arb')db.assets.sort((a,b)=>arbitrage(b)-arbitrage(a));renderMarket()}
function newAsset(){let name=prompt('Player or asset name');if(!name)return;let pos=(prompt('Position (QB/RB/WR/TE/EDGE/LB/S/CB)','WR')||'WR').toUpperCase();db.assets.push({id:uid('asset'),name,type:'PLAYER',pos,nfl:'',age:24,market:2500,adp:0,ecr:0,proj:180,ppg:0,role:65,trend:0,risk:35,liquidity:65,salary:0,years:1,roster:'',source:'Manual'});persist();renderMarket()}
function editAsset(id){let a=db.assets.find(x=>x.id===id);if(!a)return;let old=modelValue(a);let form=`EDIT ${a.name}\n\nEnter values in prompts. Cancel keeps current.`;alert(form);let fields=a.type==='PICK'?[['market','Market value'],['classStrength','Class strength 0-100'],['liquidity','Liquidity 0-100'],['risk','Risk 0-100'],['trend','Trend -20 to 20']]:[['market','Market value'],['adp','Dynasty ADP'],['ecr','ECR / rank'],['proj','Projected points'],['age','Age'],['role','Role 0-100'],['salary','Salary'],['years','Contract years'],['trend','Trend -20 to 20'],['risk','Risk 0-100'],['liquidity','Liquidity 0-100']];for(let [k,l] of fields){let v=prompt(l,a[k]??'');if(v!==null&&v!=='')a[k]=Number(v)}if(a.type==='PLAYER'){let r=prompt('Roster / owner (blank = free agent)',a.roster||'');if(r!==null)a.roster=r}let reason=prompt('Reason for update','Manual data update');if(reason!==null)a.lastReason=reason;recordHistory(a,old);persist();renderView(localStorage.getItem('ccgm_view')||'market')}
function importCSV(file){if(!file)return;let r=new FileReader();r.onload=()=>{let lines=String(r.result).trim().split(/\r?\n/);if(lines.length<2)return alert('CSV needs a header row.');let h=lines[0].split(',').map(x=>x.trim().toLowerCase());for(let line of lines.slice(1)){let vals=line.split(',');let o={};h.forEach((k,i)=>o[k]=vals[i]?.trim());if(!o.name)continue;let hit=db.assets.find(a=>a.name.toLowerCase()===o.name.toLowerCase());if(!hit){hit={id:uid('asset'),name:o.name,type:o.type||'PLAYER',pos:(o.pos||'WR').toUpperCase(),source:'CSV import'};db.assets.push(hit)}let old=modelValue(hit);['market','adp','ecr','proj','ppg','age','role','trend','risk','liquidity','salary','years'].forEach(k=>{if(o[k]!==undefined&&o[k]!=='')hit[k]=Number(o[k])});if(o.roster!==undefined)hit.roster=o.roster;hit.lastReason='CSV import';recordHistory(hit,old)}persist();renderMarket();alert('CSV imported. Expected columns can include name,pos,market,adp,ecr,proj,age,role,trend,risk,liquidity,salary,years,roster.')} ;r.readAsText(file)}
function renderSync(){let m=db.mfl;sync.innerHTML=`<div class="grid"><div class="card"><h2>MyFantasyLeague Sync Center</h2><div class="notice">Sync is read-only. It pulls league structure and rosters into this local database. It does not make transactions on MFL.</div><div class="grid3" style="margin-top:10px"><div class="field"><label>MFL host</label><input value="${m.host}" onchange="db.mfl.host=this.value;persist()"></div><div class="field"><label>Season</label><input type="number" value="${m.year}" onchange="db.mfl.year=Number(this.value);persist()"></div><div class="field"><label>League ID</label><input value="${m.leagueId}" placeholder="Enter Pride LG ID" onchange="db.mfl.leagueId=this.value;persist()"></div></div><div class="field"><label>API key (optional/private league; stored only on this device)</label><input type="password" value="${m.apiKey||''}" onchange="db.mfl.apiKey=this.value;persist()"></div><button onclick="syncMFL()">Sync Pride LG</button><div id="syncStatus" class="small" style="margin-top:8px">${db.lastSync?'Last sync: '+new Date(db.lastSync).toLocaleString():'Never synced'}</div></div><div class="card"><h2>What Sync Updates</h2>${['Franchises / team names','Current rosters','Player IDs / NFL teams / positions','Salary and contract fields when returned by MFL','Free-agent status inferred from roster ownership','League metadata'].map(x=>`<div class="gate"><span>${x}</span><b class="good">READY</b></div>`).join('')}<p class="small">If MFL blocks browser requests for your league or a private API key is required, the commercial-grade solution is a tiny secure backend proxy. We should use that before selling the app so credentials never live in client-side code.</p></div></div>`}
async function mflFetch(type,extra=''){let m=db.mfl;if(!m.leagueId)throw new Error('Enter league ID first.');let host=m.host.replace(/^https?:\/\//,'').replace(/\/$/,'');let url=`https://${host}/${m.year}/export?TYPE=${type}&L=${encodeURIComponent(m.leagueId)}&JSON=1${extra}${m.apiKey?'&APIKEY='+encodeURIComponent(m.apiKey):''}`;let res=await fetch(url,{credentials:'omit'});if(!res.ok)throw new Error(`${type}: HTTP ${res.status}`);return await res.json()}
function normalizeArr(x){if(!x)return[];return Array.isArray(x)?x:[x]}
async function syncMFL(){let el=document.getElementById('syncStatus');el.textContent='Syncing league, franchises, players and rosters…';try{let [league,players,rosters]=await Promise.all([mflFetch('league'),mflFetch('players'),mflFetch('rosters')]);let franchises=normalizeArr(league?.league?.franchises?.franchise);let fname={};franchises.forEach(f=>fname[f.id]=f.name||f.id);let plist=normalizeArr(players?.players?.player);let pmap={};plist.forEach(p=>pmap[p.id]=p);let rosterArr=normalizeArr(rosters?.rosters?.franchise);let owned=new Set();for(let fr of rosterArr){for(let rp of normalizeArr(fr.player)){owned.add(rp.id);let p=pmap[rp.id]||{};let name=p.name||rp.name||rp.id;let hit=db.assets.find(a=>a.mflId===rp.id||a.name===name);if(!hit){hit={id:uid('mfl'),mflId:rp.id,name,type:'PLAYER',pos:(p.position||p.pos||'').toUpperCase(),nfl:p.team||'',age:0,market:1200,adp:0,ecr:0,proj:0,role:55,trend:0,risk:40,liquidity:55,source:'MFL sync'};db.assets.push(hit)}let old=modelValue(hit);hit.mflId=rp.id;hit.name=name;hit.pos=(p.position||hit.pos||'').toUpperCase();hit.nfl=p.team||hit.nfl||'';hit.roster=fname[fr.id]||fr.id;if(rp.salary!==undefined)hit.salary=Number(rp.salary);if(rp.contractYear!==undefined)hit.years=Number(rp.contractYear);if(rp.contract!==undefined&&!hit.years)hit.years=Number(rp.contract);hit.lastReason='MFL roster sync';recordHistory(hit,old)}}db.lastSync=new Date().toISOString();persist();el.innerHTML=`<span class="good">SYNC COMPLETE</span> · ${franchises.length} franchises · ${owned.size} rostered players · ${db.assets.length} assets in local DB`;renderAssetList()}catch(err){el.innerHTML=`<span class="bad">SYNC FAILED:</span> ${err.message}. Verify host, season, league ID, league privacy/API access and browser CORS.`}}
function renderSettings(){let c=db.config;settings.innerHTML=`<div class="grid"><div class="card"><h2>League Rules</h2><div class="grid3"><div class="field"><label>League name</label><input value="${c.leagueName}" onchange="cset('leagueName',this.value)"></div><div class="field"><label>Your franchise</label><input value="${c.teamName}" onchange="cset('teamName',this.value)"></div><div class="field"><label>Teams</label><input type="number" value="${c.teams}" onchange="cset('teams',Number(this.value))"></div><div class="field"><label>Salary cap</label><input type="number" value="${c.salaryCap}" onchange="cset('salaryCap',Number(this.value))"></div><div class="field"><label>B- threshold</label><input type="number" value="${c.threshold}" onchange="cset('threshold',Number(this.value))"></div><div class="field"><label>Prongs required</label><input type="number" value="${c.requiredProngs}" onchange="cset('requiredProngs',Number(this.value))"></div></div>${['superflex','tep','idp','sackPremium'].map(k=>`<label class="gate"><span>${k==='tep'?'TE Premium':k==='idp'?'IDP':k==='sackPremium'?'Sack Premium':'Superflex'}</span><input style="width:auto" type="checkbox" ${c[k]?'checked':''} onchange="cset('${k}',this.checked)"></label>`).join('')}</div><div class="card"><h2>Replacement-Level Points</h2><div class="grid4">${Object.keys(c.replacement).map(k=>`<div class="field"><label>${k}</label><input type="number" value="${c.replacement[k]}" onchange="db.config.replacement['${k}']=Number(this.value);persist()"></div>`).join('')}</div><p class="small">Replacement level is critical. It converts raw projections into points above replacement so scarce positions are valued correctly for your league.</p></div></div><div class="grid" style="margin-top:12px"><div class="card"><h2>Value Engine Weights</h2>${Object.keys(c.weights).map(k=>`<div class="field"><label>${k} (${Math.round(c.weights[k]*100)}%)</label><input type="range" min="0" max="30" value="${c.weights[k]*100}" oninput="db.config.weights['${k}']=Number(this.value)/100;this.previousElementSibling.textContent='${k} ('+this.value+'%)';persist()"></div>`).join('')}</div><div class="card"><h2>Data Controls</h2><button class="secondary" onclick="exportData()">Export Full Backup</button> <button class="secondary" onclick="downloadCSV()">Export Market CSV</button><hr style="border-color:#263753"><button class="danger" onclick="resetAll()">Reset App Database</button><p class="small">Reset returns to the bundled seed database and erases local edits/history from this device.</p><p class="small">App version ${APP_VERSION}</p></div></div>`}
function cset(k,v){db.config[k]=v;persist();document.getElementById('subline').textContent=`${db.config.leagueName} engine • ${db.config.superflex?'SF • ':''}${db.config.tep?'TEP • ':''}${db.config.sackPremium?'sack-premium IDP • ':''}cap/contracts • dynamic asset pricing`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`capitol-carnage-gm-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.assets||!x.config)throw Error('Invalid backup');db=x;persist();renderAssetList();showView('dashboard');alert('Backup restored.')}catch(e){alert('Could not restore: '+e.message)}};r.readAsText(file)}
function downloadCSV(){let cols=['name','type','pos','roster','market','adp','ecr','proj','age','role','trend','risk','liquidity','salary','years'];let rows=[cols.join(','),...db.assets.map(a=>cols.map(k=>JSON.stringify(a[k]??'')).join(','))];let b=new Blob([rows.join('\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ccgm-market-board.csv';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Erase local app data and return to seed database?')){localStorage.removeItem('ccgm_db');db=loadDB();renderAssetList();showView('dashboard')}}
function renderAssetList(){document.getElementById('assetList').innerHTML=db.assets.map(a=>`<option value="${a.name}">`).join('')}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');
nav();renderAssetList();cset('leagueName',db.config.leagueName);let initial=localStorage.getItem('ccgm_view')||'dashboard';if(!tradeState.receive.length)addTrade('receive');if(!tradeState.give.length)addTrade('give');showView(initial);
</script>
