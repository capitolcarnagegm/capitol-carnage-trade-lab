<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>GM's Locker — Pride Dynasty</title>
  <meta name="description" content="War Room for Fantrax dynasty. Simulate moves. Execute in your league.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23050505' width='64' height='64' rx='12'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' font-family='system-ui' font-weight='800' fill='%23d4af37'%3EGM%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">GM</div>
      <div>
        GM's Locker
        <div style="font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0.08em">PRIDE DYNASTY · FANTRAX</div>
      </div>
    </div>
    <div class="asof" id="asof">Connecting…</div>
  </header>

  <nav class="nav" id="nav">
    <button type="button" data-view="war">War Room</button>
    <button type="button" data-view="team">My Team</button>
    <button type="button" data-view="teams">Teams</button>
    <button type="button" data-view="cap">Cap / Dead</button>
    <button type="button" data-view="bhs">Buy / Hold / Sell</button>
    <button type="button" data-view="waivers">Waivers</button>
    <button type="button" data-view="trade">Trade Lab</button>
    <button type="button" data-view="analysts">Analysts</button>
    <button type="button" data-view="picks">Picks</button>
    <button type="button" data-view="news">News</button>
    <button type="button" data-view="chat">GM Chat</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <main class="main" id="main">
    <div class="loading">Loading GM's Locker…</div>
  </main>

  <footer class="site-footer">
    <div><span class="gold">GM's Locker</span> · Simulate here · Execute in Fantrax</div>
    <div style="margin-top:6px">Pride ain't cheap. · Bylaws-aware · O + IDP</div>
  </footer>

  <div class="pinvault" id="pinvault">
    <span class="x" id="pinvaultClose" title="Dismiss">×</span>
    <a href="https://www.pinvaultcollectibles.com" target="_blank" rel="noopener" class="pv-link">
      <img src="pinvault-logo.jpg" alt="Pin Vault Collectibles" class="pv-logo" width="120" height="120" onerror="this.style.display='none'">
      <span class="pv-tag">Get your collectibles from Pin Vault Collectibles</span>
    </a>
  </div>

  <script src="app.js"></script>
</body>
</html>
