function liquidityScore(a){return clamp(a.liquidity||65)}

function pickMultiplier(a){let yearDisc=Math.max(.72,1-(Math.max(0,(Number(a.year)||2027)-2027)*.08));let roundMult={1:1,2:.62,3:.32,4:.16}[a.round]||.12;let cls=(Number(a.classStrength)||75)/85;let slot=(pickSlotScore(a)/78);return yearDisc*roundMult*cls*slot}

function teamAssets(team){

function assetPos(a){
  if(a.type==='PICK') return 'PICKS';
  let p=String(a.pos||'').toUpperCase();
  if(['DE','DT','EDGE','DL'].includes(p)) return 'DL';
  if(['CB','S','DB'].includes(p)) return 'DB';
  if(['PK','K'].includes(p)) return 'K';

function addAssetToTrade(side,assetId){

  tradeState[side].push({assetId,salaryOverride:'',yearsOverride:''});
  renderTrade();
}

function tradeAsset(obj){

function sideValue(side,lens='overall'){

}

function postTradeImpact(){
  const get=tradeState.receive.map(tradeAsset).filter(Boolean);
  const give=tradeState.give.map(tradeAsset).filter(Boolean);
  const points=get.reduce((s,a)=>s+(Number(a.proj)||0),0)-give.reduce((s,a)=>s+(Number(a.proj)||0),0);
  const salary=get.reduce((s,a)=>s+(Number(a.salary)||0),0)-give.reduce((s,a)=>s+(Number(a.salary)||0),0);
  const value=get.reduce((s,a)=>s+modelValue(a),0)-give.reduce((s,a)=>s+modelValue(a),0);

  const warnings=[];
  const our=teamAssets(db.config.teamName).filter(a=>a.type!=='PICK');
  const giveIds=new Set(give.map(a=>a.id));
  const getPlayers=get.filter(a=>a.type!=='PICK');
  for(const pos of ['QB','RB','WR','TE','DL','LB','DB']){
    const before=our.filter(a=>assetPos(a)===pos).length;
    const outgoing=give.filter(a=>assetPos(a)===pos && a.type!=='PICK').length;
    const incoming=getPlayers.filter(a=>assetPos(a)===pos).length;
    const after=before-outgoing+incoming;
    if(before>=2 && after<2) warnings.push(`${pos} depth falls to ${after}`);
    if(before===1 && after===0) warnings.push(`${pos} room becomes empty`);
  }
  return {points,salary,value,warnings};
}
function tradeAnalysis(){
  let lens=tradeState.lens,r=sideValue('receive',lens),g=sideValue('give',lens),edge=g?(r-g)/g:0;
  let needle=clamp(50-edge*110,5,95);
  let prongKeys=['Production','Roster Fit','Market Timing','Contract Value','Championship Impact','Cap Leverage','Outside Market'];
  let pass=0;
  let prongRows=prongKeys.map(k=>{
    let rv=sideAvgProng('receive',k),gv=sideAvgProng('give',k),p=rv>=db.config.threshold;
    pass+=p?1:0;
    return `<div class="gate"><span><b>${k}</b><br><span class="small">Receive ${rv.toFixed(0)} vs Give ${gv.toFixed(0)}</span></span><b class="${p?'good':'bad'}">${p?'PASS':'FAIL'} ${rv>=gv?'▲':'▼'}</b></div>`
  }).join('');
  let gates=[r>=g*.95,sideAvgProng('receive','Roster Fit')>=sideAvgProng('give','Roster Fit'),sideAvgProng('receive','Contract Value')>=sideAvgProng('give','Contract Value')-5,sideAvgProng('receive','Outside Market')>=sideAvgProng('give','Outside Market')-5];

  return {r,g,edge,needle,prongRows,gates,gc,majority,hard,grade,verdict,vc}
}

function nflWeekEstimate(){const d=new Date(),y=d.getFullYear(),kickoff=new Date(`${y}-09-03T00:00:00`);if(d<kickoff)return 0;return clamp(Math.floor((d-kickoff)/(7*86400000))+1,1,18)}

function teamMetrics(team){const starters=teamStarterPool(team),roster=teamAssets(team).filter(a=>a.type!=='PICK'),projected=starters.reduce((s,a)=>s+Number(a.proj||0),0),actual=starters.reduce((s,a)=>s+playerProduction(a),0),pw=currentProductionWeight(),wk=nflWeekEstimate(),ann=(wk&&actual)?actual/wk*17:0,blend=projected*(1-pw)+(ann||projected)*pw,vol=starters.length?starters.reduce((s,a)=>s+playerVolatility(a),0)/starters.length:0,floor=blend*(1-clamp(vol*.38,.05,.32)),ceiling=blend*(1+clamp(vol*.52,.08,.45)),asset=roster.reduce((s,a)=>s+modelValue(a),0),label=vol<.28?'STABLE':vol<.48?'MIXED':'BOOM/BUST';return{team,projected,actual,blend,vol,floor,ceiling,asset,label,score:blend+asset*.002}}

function renderAnalyzer(){const arr=leaguePower(),pw=currentProductionWeight(),wk=nflWeekEstimate(),mine=arr.find(x=>x.team===db.config.teamName);analyzer.innerHTML=`<div class="card"><div class="sectionhead"><h2>League Power Analyzer</h2><span class="pill">${wk?'WEEK '+wk:'PRESEASON'}</span></div><div class="notice"><b>Adaptive rankings:</b> preseason is projection-driven; actual production gains weight as the season grows.</div><div class="teamProfileGrid" style="margin-top:10px"><div class="metric"><b>${Math.round((1-pw)*100)}%</b><span>Projection weight</span></div><div class="metric"><b>${Math.round(pw*100)}%</b><span>Production weight</span></div><div class="metric"><b>${mine?'#'+mine.rank:'—'}</b><span>Your rank</span></div><div class="metric"><b>${mine?mine.label:'—'}</b><span>Volatility</span></div><div class="metric"><b>${mine?Math.round(mine.blend):0}</b><span>Power points</span></div></div></div><div class="card" style="margin-top:12px;overflow:auto"><table class="powerTable"><thead><tr><th>#</th><th>Team</th><th>Power</th><th>Proj</th><th>Actual</th><th>Floor/Ceiling</th><th>Profile</th><th>Roster Value</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${x.rank}</b></td><td><b>${x.team}</b></td><td><div class="powerBar"><i style="width:${x.powerPct}%"></i></div><span class="small">${x.score.toFixed(0)}</span></td><td>${x.projected.toFixed(0)}</td><td>${x.actual?x.actual.toFixed(1):'—'}</td><td>${x.floor.toFixed(0)} / ${x.ceiling.toFixed(0)}</td><td><span class="riskBadge ${volatilityClass(x.label)}">${x.label}</span></td><td>${fmt(x.asset)}</td></tr>`).join('')}</tbody></table></div>`}

function sourceBadge(a,field='roster'){
  const src=(a?.sources?.[field]||a?.source||'MFL').toUpperCase();
  const cls=src.includes('SCREEN')?'shot':src.includes('MANUAL')?'manual':'mfl';
  return `<span class="sourceBadge ${cls}">${src.includes('SCREEN')?'SCREENSHOT':src.includes('MANUAL')?'MANUAL':'MFL'}</span>`;
}
function setFieldSource(a,field,src){
  a.sources=a.sources||{};a.sources[field]=src;
}
function ensureWeeklyFields(a){
  if(!Array.isArray(a.weeklyScores))a.weeklyScores=[];
  if(a.actual===undefined)a.actual=0;
  return a;
}
function teamPositionMetrics(team){
  const groups=['QB','RB','WR','TE','DL','LB','DB'];
  const roster=teamAssets(team).filter(a=>a.type!=='PICK');
  const raw={};
  groups.forEach(p=>{
    const vals=roster.filter(a=>normalizedPos(a.pos)===p).sort((a,b)=>modelValue(b)-modelValue(a));
    const take={QB:2,RB:3,WR:4,TE:2,DL:3,LB:3,DB:3}[p]||2;
    raw[p]=vals.slice(0,take).reduce((s,a)=>s+modelValue(a),0);
  });
  return raw;
}
function leaguePositionRanks(){
  const teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(Boolean);
  const rows={};
  teams.forEach(t=>rows[t]=teamPositionMetrics(t));
  const out={};
  teams.forEach(t=>{out[t]={};for(const p of ['QB','RB','WR','TE','DL','LB','DB']){
    const sorted=teams.slice().sort((a,b)=>(rows[b][p]||0)-(rows[a][p]||0));
    out[t][p]=sorted.indexOf(t)+1;
  }});
  return out;
}
function teamCapMetrics(team){
  const r=teamAssets(team).filter(a=>a.type!=='PICK');
  const salary=r.reduce((s,a)=>s+Number(a.salary||0),0);
  const value=r.reduce((s,a)=>s+modelValue(a),0);
  const efficiency=salary?value/salary:value;
  const cheapCore=r.filter(a=>Number(a.salary||0)<=25&&modelValue(a)>=3500).length;
  return {salary,value,efficiency,cheapCore};
}
function teamDraftMetrics(team){
  const picks=teamAssets(team).filter(a=>a.type==='PICK');
  return {count:picks.length,value:picks.reduce((s,a)=>s+modelValue(a),0)}
}
function fullTeamProfile(team){
  const base=teamMetrics(team),cap=teamCapMetrics(team),draft=teamDraftMetrics(team);
  const positions=teamPositionMetrics(team);
  const roster=teamAssets(team).filter(a=>a.type!=='PICK');
  const ageVals=roster.map(a=>Number(a.age||0)).filter(Boolean);
  const avgAge=ageVals.length?ageVals.reduce((s,x)=>s+x,0)/ageVals.length:0;
  const risk=roster.length?roster.reduce((s,a)=>s+Number(a.risk||45),0)/roster.length:45;
  return {...base,cap,draft,positions,avgAge,risk};
}

async function postImagesToWorker(path,files){
  let base=(db.mfl?.proxyUrl||'').trim().replace(/\/$/,'');if(!base)throw new Error('Worker URL not configured.');
  const fd=new FormData();Array.from(files||[]).forEach((f,i)=>fd.append('images',f,f.name||`image-${i}.png`));
  const res=await fetch(base+path,{method:'POST',body:fd,mode:'cors'});let p;try{p=await res.json()}catch{throw new Error(`Worker returned HTTP ${res.status} without JSON.`)}
  if(!res.ok||!p.ok)throw new Error(p.error||`HTTP ${res.status}`);return p;
}

function mflPlayerUniverse(){
  const raw=db.mfl?.rawPlayers||db.mfl?.playersRaw||db.mfl?.players||{};
  if(Array.isArray(raw)) return raw;
  if(Array.isArray(raw?.players?.player)) return raw.players.player;
  if(Array.isArray(raw?.player)) return raw.player;
  if(raw?.players?.player && typeof raw.players.player==='object') return Object.values(raw.players.player);
  if(raw && typeof raw==='object'){
    const vals=Object.values(raw);
    if(vals.length && vals.some(v=>v&&typeof v==='object')) return vals;
  }

}
function ownedLeaguePlayerIds(){

  for(const a of (db.assets||[])){

    }
  }

function activeFantasyPlayer(p){
  const pos=String(p.position||p.pos||'').toUpperCase();
  if(!['QB','RB','WR','TE','DL','DE','DT','LB','CB','S','DB','K','PK'].includes(pos)) return false;
  const st=String(p.status||p.playerStatus||'').toLowerCase();
  if(/retired|inactive permanently/.test(st)) return false;
  return !!(p.id||p.player_id||p.name);
}
function deriveLeagueFreeAgents(){
  const owned=ownedLeaguePlayerIds();
  const byMfl=new Map((db.assets||[]).filter(a=>a.mflId).map(a=>[String(a.mflId),a]));
  const byName=new Map((db.assets||[]).map(a=>[String(a.name||'').toLowerCase(),a]));
  const out=[];
  for(const p of mflPlayerUniverse()){
    const id=String(p.id||p.player_id||p.playerId||'');
    if(id && owned.has(id)) continue;
    if(!activeFantasyPlayer(p)) continue;
    const name=p.name||p.fullName||p.player_name||'';
    if(!name) continue;
    const local=byMfl.get(id)||byName.get(String(name).toLowerCase());
    if(local){
      const r=String(local.roster||'').toUpperCase();
      if(r && r!=='FREE AGENT' && r!=='FA') continue;
    }
    out.push({
      id:id||local?.id||name,
      mflId:id,
      name,
      pos:String(p.position||p.pos||local?.pos||'').toUpperCase(),
      nfl:String(p.team||p.nflTeam||local?.nfl||''),
      age:Number(p.age||local?.age||0),
      proj:Number(p.proj||p.projectedPoints||local?.proj||0),
      role:Number(local?.role||50),
      trend:Number(local?.trend||0),
      risk:Number(local?.risk||45),
      market:Number(local?.market||0),
      roster:'FREE AGENT',
      source:local?.source||'MFL'
    });
  }
  if(!out.length){
    for(const a of (db.assets||[])){
      const r=String(a.roster||'').toUpperCase();
      if(r==='FREE AGENT'||r==='FA') out.push({...a});
    }
  }
  return out.sort((a,b)=>(Number(b.proj||0)-Number(a.proj||0))||(modelValue(b)-modelValue(a)));
}

function blindBidModel(a,ov={}){
  const pos=normalizedPos(a?.pos||ov.pos||'WR');
  const proj=Math.max(0,Number(ov.proj??a?.proj??0));
  const role=Math.max(0,Math.min(100,Number(ov.role??a?.role??50)));
  const sentiment=Math.max(0,Math.min(100,Number(ov.sentiment??(50+Number(a?.trend||0)*3))));
  const breakout=Math.max(0,Math.min(100,Number(ov.breakout??Math.max(15,Math.min(85,35+(100-Number(a?.risk||45))*.2+(role-50)*.35)))));
  const security=Math.max(0,Math.min(100,Number(ov.security??(100-Number(a?.risk||45)))));
  const age=Number(ov.age??a?.age??25);
  const budget=Math.max(1,Number(ov.budget??db.config?.faBudget??100));
  const baseline={QB:260,RB:150,WR:165,TE:145,DL:120,LB:130,DB:115}[pos]||150;
  const scarcity={QB:1.18,RB:1.24,WR:1.00,TE:1.12,DL:1.10,LB:1.05,DB:.92}[pos]||1;
  const production=Math.max(.15,Math.min(1.6,proj/baseline));
  const roleM=.55+role/100*.75, sentM=.82+sentiment/100*.36, breakM=.82+breakout/100*.50, secM=.78+security/100*.42;
  let ageM=1;
  if(pos==='RB') ageM=age<=24?1.08:age<=27?1:age<=29?.90:.75;
  else if(['WR','TE'].includes(pos)) ageM=age<=25?1.06:age<=29?1:age<=31?.92:.82;
  else if(pos==='QB') ageM=age<=30?1.03:age<=34?1:.92;
  else ageM=age<=27?1.04:age<=30?1:.90;
  let pct=.018+.105*production*roleM*sentM*breakM*secM*scarcity*ageM;
  pct=Math.max(.005,Math.min(.42,pct));
  const target=Math.max(1,Math.round(budget*pct));
  const floor=Math.max(1,Math.round(target*.72));
  const ceiling=Math.max(target,Math.round(target*1.28));
  const score=Math.round(Math.min(100,production*30+role*.20+sentiment*.12+breakout*.18+security*.10+scarcity/1.24*10));
  const grade=score>=88?'A+':score>=82?'A':score>=76?'A-':score>=70?'B+':score>=64?'B':score>=58?'B-':'C';
  return {target,floor,ceiling,score,grade,proj,role,sentiment,breakout,security,pos,scarcity};
}

      ].map(x=>`<div class="gate"><span><b>${x[0]}</b><br><span class="small">${x[1]}</span></span><b class="good">SYNC</b></div>`).join('')}
    </div>
  </div>
  
  <div class="card" style="margin-top:12px">
    <div class="sectionhead"><h2>Roster Screenshot Merge</h2><span class="pill">CORRECTION LAYER</span></div>
    <div class="notice"><b>MFL stays primary.</b> Upload screenshots only to fill missing players/fields or reconcile a team. Nothing is committed until you review it.</div>
    <div class="importGrid" style="margin-top:10px">
      <label class="nativeUpload"><strong>Upload roster screenshots</strong><div class="uploadHint">Choose one or multiple team screenshots. Up to all 14 teams.</div><input id="rosterShots" type="file" accept="image/*" multiple onchange="handleRosterScreenshots(this.files)"></label>
      <div class="field"><label>Merge mode</label><select id="rosterMergeMode"><option value="missing">Missing players only</option><option value="fields">Fill missing salary/years/status</option><option value="reconcile">Full reconciliation review</option></select><div class="small" style="margin-top:8px">Safest default: Missing players only.</div></div>
    </div>
    <div id="rosterImportReview"></div>
  </div>
<div class="grid" style="margin-top:12px">
    <div class="card"><h2>Synced Franchises</h2>${(m.franchises||[]).length?(m.franchises||[]).map(f=>`<div class="gate"><span>${f.name}</span><span class="small">${f.id}</span></div>`).join(''):'<div class="muted">Connect the Worker, then run the first sync.</div>'}</div>
    <div class="card"><h2>Recent MFL Activity</h2>${(m.transactions||[]).length?(m.transactions||[]).slice(0,12).map(t=>`<div class="gate"><span><b>${t.franchise||'League'}</b><br><span class="small">${t.type||'transaction'}${t.player?' · '+t.player:''}</span></span></div>`).join(''):'<div class="muted">Transactions will appear here after sync.</div>'}</div>
  </div>`;
}

function normalizeArr(x){if(!x)return[];return Array.isArray(x)?x:[x]}
function mflDeepArray(obj, paths){
  for(const path of paths){
    let cur=obj;
    for(const key of path.split('.')) cur=cur?.[key];
    if(cur!==undefined && cur!==null) return normalizeArr(cur);
  }
  return [];
}
function mflHost(){
  let h=(db.mfl.host||'www45.myfantasyleague.com').replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(!h.includes('myfantasyleague.com')) h='www45.myfantasyleague.com';
  return h;
}
function mflUrl(type, extra=''){
  const m=db.mfl;
  return `https://${mflHost()}/${m.year||2026}/export?TYPE=${encodeURIComponent(type)}&L=${encodeURIComponent(m.leagueId||'29218')}&JSON=1${extra}${m.apiKey?'&APIKEY='+encodeURIComponent(m.apiKey):''}`;
}
async function mflFetch(type,extra=''){
  if(!db.mfl.leagueId) throw new Error('League ID is missing.');
  const res=await fetch(mflUrl(type,extra),{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',headers:{'Accept':'application/json,text/plain,*/*'}});
  if(!res.ok) throw new Error(`${type}: HTTP ${res.status}`);
  const txt=await res.text();
  try{return JSON.parse(txt)}
  catch(e){throw new Error(`${type}: MFL did not return JSON. ${txt.slice(0,120).replace(/\s+/g,' ')}`)}
}
function ensureMFLDefaults(){
  db.mfl=db.mfl||{};
  db.mfl.host=db.mfl.host||'www45.myfantasyleague.com';
  db.mfl.year=Number(db.mfl.year)||2026;
  db.mfl.leagueId=String(db.mfl.leagueId||'29218');
  db.mfl.apiKey=db.mfl.apiKey||'';
  db.mfl.proxyUrl=db.mfl.proxyUrl||'';
  db.mfl.franchises=db.mfl.franchises||[];
  if(!db.mfl.franchises.length) db.mfl.franchises=[
    {id:'0001',name:'Classy Strippers'},{id:'0002',name:'[redacted] adp1897'},
    {id:'0003',name:'Agent Smith'},{id:'0004',name:'Chicago Challupas'},
    {id:'0005',name:'DieNasty Sage'},{id:'0006',name:'Disabled Vigilantes'},
    {id:'0007',name:'Capitol Carnage'},{id:'0008',name:'Killers Next Door'},
    {id:'0009',name:'Hollywood Cole Bros.'},{id:'0010',name:'Stackinyards'},
    {id:'0011',name:'The Boss'},{id:'0012',name:'Unfuckwitable'},
    {id:'0013',name:'West Coast Giants'},{id:'0014',name:'MakeWubaGreatAgain'}
  ];
  db.mfl.standings=db.mfl.standings||[];
  db.mfl.transactions=db.mfl.transactions||[];
  db.mfl.draftResults=db.mfl.draftResults||[];
  db.mfl.lastCounts=db.mfl.lastCounts||{};
}
function mflPlayerName(p){
  if(!p)return'';
  if(p.name)return p.name;
  return `${p.firstname||p.firstName||''} ${p.lastname||p.lastName||''}`.trim();
}
function safeNum(v){
  if(v===undefined||v===null||v==='')return undefined;
  const n=Number(String(v).replace(/[$,]/g,''));
  return Number.isFinite(n)?n:undefined;
}
function mergeMFLAsset(p,rp,franchiseName){
  const pid=String(rp?.id||p?.id||'');
  const name=mflPlayerName(p)||rp?.name||pid;
  if(!pid&&!name)return null;
  let hit=db.assets.find(a=>String(a.mflId||'')===pid) ||
          db.assets.find(a=>String(a.name||'').toLowerCase()===String(name).toLowerCase());
  if(!hit){
    hit={id:uid('mfl'),mflId:pid,name,type:'PLAYER',
      pos:String(p?.position||p?.pos||rp?.position||'').toUpperCase(),
      nfl:p?.team||rp?.team||'',age:0,market:1000,adp:0,ecr:0,proj:0,ppg:0,
      role:50,trend:0,risk:45,liquidity:50,salary:0,years:0,
      roster:franchiseName||'FREE AGENT',source:'MFL sync'};
    db.assets.push(hit);
  }
  const old=modelValue(hit);
  hit.mflId=pid||hit.mflId;
  hit.name=name||hit.name;
  hit.pos=String(p?.position||p?.pos||hit.pos||'').toUpperCase();
  hit.nfl=p?.team||hit.nfl||'';
  hit.roster=franchiseName||'FREE AGENT';
  const sal=safeNum(rp?.salary ?? rp?.sal);
  const yrs=safeNum(rp?.contractYear ?? rp?.contractYears ?? rp?.contract ?? rp?.years);
  if(sal!==undefined)hit.salary=sal;
  if(yrs!==undefined)hit.years=yrs;
  hit.source=(hit.source&&hit.source!=='Manual seed')?hit.source:'MFL + local model';
  hit.lastReason='MFL league sync';
  recordHistory(hit,old);
  return hit;
}
function parseMFLTransactions(obj,franchiseMap,playerMap){
  return mflDeepArray(obj,['transactions.transaction','transaction']).map(t=>{
    const fid=String(t.franchise||t.franchise_id||'');
    const pid=String(t.player||t.player_id||'');
    return {timestamp:t.timestamp||t.date||t.time||'',type:t.type||t.transaction_type||'',
      franchise:franchiseMap[fid]||fid,
      player:mflPlayerName(playerMap[pid])||pid,raw:t};
  });
}
function renderSyncSummary(){
  const c=db.mfl?.lastCounts||{};
  return `<div class="grid4" style="margin-top:10px">
    <div class="metric"><b>${c.franchises||0}</b><span>Franchises</span></div>
    <div class="metric"><b>${c.rostered||0}</b><span>Rostered players</span></div>
    <div class="metric"><b>${c.freeAgents||0}</b><span>Free agents indexed</span></div>
    <div class="metric"><b>${c.transactions||0}</b><span>Transactions loaded</span></div>
  </div>`;
}

async function proxyFetch(path){
  ensureMFLDefaults();
  let base=(db.mfl.proxyUrl||'').trim().replace(/\/$/,'');
  if(!base) throw new Error('Cloudflare Worker URL is not set yet.');
  const res=await fetch(base+path,{method:'GET',mode:'cors',cache:'no-store',headers:{'Accept':'application/json'}});
  let payload;
  try{payload=await res.json()}catch(e){throw new Error(`Sync service returned HTTP ${res.status} without JSON.`)}
  if(!res.ok || payload?.ok===false) throw new Error(payload?.error||`Sync service HTTP ${res.status}`);
  return payload;
}
async function testMFLConnection(){
  const el=document.getElementById('syncStatus');
  el.textContent='Testing secure sync service…';
  try{
    const x=await proxyFetch('/health');
    el.innerHTML=`<span class="good">SYNC SERVICE ONLINE</span> · Pride LG ${x.leagueId} · ${x.season}`;
  }catch(err){
    el.innerHTML=`<span class="bad">CONNECTION FAILED:</span> ${err.message}`;
  }
}
async function syncMFL(){
  ensureMFLDefaults();
  const el=document.getElementById('syncStatus');
  el.innerHTML='Securely syncing <b>Pride LG 29218</b> through the Worker…';
  try{
    const bundle=await proxyFetch('/sync');
    const league=bundle.data?.league||{};
    const players=bundle.data?.players||{};
    const rosters=bundle.data?.rosters||{};
    const standings=bundle.data?.standings||{};
    const transactions=bundle.data?.transactions||{};
    const draftResults=bundle.data?.draftResults||{};
    const futureDraftPicks=bundle.data?.futureDraftPicks||{};

    const franchises=mflDeepArray(league,['league.franchises.franchise','franchises.franchise']);
    const franchiseMap={};
    franchises.forEach(f=>{
      const id=String(f.id||f.franchise_id||'');
      franchiseMap[id]=f.name||f.owner_name||id;
    });

    const plist=mflDeepArray(players,['players.player','player']);
    const playerMap={};
    plist.forEach(p=>{if(p?.id!==undefined)playerMap[String(p.id)]=p});

    const rosterArr=mflDeepArray(rosters,['rosters.franchise','franchise']);
    const owned=new Set();
    for(const fr of rosterArr){
      const fid=String(fr.id||fr.franchise_id||'');
      const fname=franchiseMap[fid]||fid||'Unknown franchise';
      for(const rp of normalizeArr(fr.player)){
        const pid=String(rp?.id||'');
        if(pid)owned.add(pid);
        mergeMFLAsset(playerMap[pid]||{},rp,fname);
      }
    }

    let freeAgents=0;
    for(const p of plist){
      const pid=String(p?.id||'');
      if(!pid||owned.has(pid))continue;
      const pos=String(p.position||p.pos||'').toUpperCase();
      if(!['QB','RB','WR','TE','PK','K','DL','DE','DT','EDGE','LB','CB','S','DB'].includes(pos))continue;
      const hit=db.assets.find(a=>String(a.mflId||'')===pid);
      if(hit)hit.roster='FREE AGENT';
      else mergeMFLAsset(p,{id:pid},'FREE AGENT');
      freeAgents++;
    }

    db.mfl.standings=mflDeepArray(standings,['leagueStandings.franchise','standings.franchise','franchise']).map(s=>{
      const fid=String(s.id||s.franchise_id||'');
      return {franchise:franchiseMap[fid]||fid,wins:s.h2hw||s.wins||s.w||0,
        losses:s.h2hl||s.losses||s.l||0,points:s.pf||s.points_for||s.points||0,raw:s};
    });
    db.mfl.transactions=parseMFLTransactions(transactions,franchiseMap,playerMap);
    
    db.mfl.draftResults=mflDeepArray(draftResults,['draftResults.draftUnit.draftPick','draftResults.draftPick','draftPick']);

    // Best-effort future pick ownership ingestion. MFL's exact nesting can vary by league/year.
    const pickRows=mflDeepArray(futureDraftPicks,[
      'futureDraftPicks.franchise',
      'futureDraftPicks.futureDraftPick',
      'futureDraftPicks.draftPick',
      'franchise',
      'futureDraftPick',
      'draftPick'
    ]);
    if(pickRows.length){
      // Remove only prior MFL-generated future picks so a refresh does not duplicate them.
      db.assets=db.assets.filter(a=>!(a.type==='PICK' && a.source==='MFL future picks'));
      const seen=new Set();
      function addPick(owner,year,round,slotLabel=''){
        owner=franchiseMap[String(owner)]||owner||'';
        year=Number(year)||2027; round=Number(round)||1;
        const key=`${owner}|${year}|${round}|${slotLabel}`;
        if(!owner||seen.has(key))return; seen.add(key);
        const name=`${year} ${slotLabel?slotLabel+' ':''}${round===1?'1st':round===2?'2nd':round===3?'3rd':round+'th'}`.replace(/\s+/g,' ').trim();
        db.assets.push({
          id:uid('pick'),name,type:'PICK',pos:'PICK',roster:owner,year,round,
          market:round===1?5200:round===2?2400:round===3?1000:500,
          classStrength:80,slot:slotLabel||'MID',trend:0,risk:35,liquidity:90,
          salary:0,years:0,proj:0,role:70,source:'MFL future picks',lastReason:'MFL future pick sync'
        });
      }
      pickRows.forEach(row=>{
        const owner=row.franchise_id||row.franchise||row.owner||row.id;
        const nested=normalizeArr(row.pick||row.draftPick||row.futureDraftPick);
        if(nested.length){
          nested.forEach(p=>addPick(owner,p.year||p.season,p.round,p.slot||p.position||''));
        }else{
          addPick(owner,row.year||row.season,row.round,row.slot||row.position||'');
        }
      });
    }

    db.mfl.franchises=franchises.map(f=>({id:String(f.id||f.franchise_id||''),name:f.name||f.owner_name||String(f.id||'')}));

    if(league?.league?.name)db.config.leagueName=league.league.name;
    const carnage=db.mfl.franchises.find(f=>/capitol carnage/i.test(f.name));
    if(carnage)db.config.teamName=carnage.name;

    db.mfl.lastCounts={franchises:db.mfl.franchises.length,rostered:owned.size,freeAgents,
      transactions:db.mfl.transactions.length,indexedPlayers:plist.length};
    db.lastSync=bundle.syncedAt||new Date().toISOString();
    persist();renderAssetList();renderSync();

    const out=document.getElementById('syncStatus');
    if(out)out.innerHTML=`<span class="good">SYNC COMPLETE</span> · ${new Date(db.lastSync).toLocaleString()} · ${db.mfl.lastCounts.franchises} franchises · ${db.mfl.lastCounts.rostered} rostered · ${db.mfl.lastCounts.indexedPlayers} MFL players indexed`;
  }catch(err){
    el.innerHTML=`<span class="bad">SYNC FAILED:</span> ${err.message}`;
  }
}

function renderSettings(){let c=db.config;settings.innerHTML=`<div class="grid"><div class="card"><h2>League Rules</h2><div class="grid3"><div class="field"><label>League name</label><input value="${c.leagueName}" onchange="cset('leagueName',this.value)"></div><div class="field"><label>Your franchise</label><input value="${c.teamName}" onchange="cset('teamName',this.value)"></div><div class="field"><label>Teams</label><input type="number" value="${c.teams}" onchange="cset('teams',Number(this.value))"></div><div class="field"><label>Salary cap</label><input type="number" value="${c.salaryCap}" onchange="cset('salaryCap',Number(this.value))"></div><div class="field"><label>B- threshold</label><input type="number" value="${c.threshold}" onchange="cset('threshold',Number(this.value))"></div><div class="field"><label>Prongs required</label><input type="number" value="${c.requiredProngs}" onchange="cset('requiredProngs',Number(this.value))"></div></div>${['superflex','tep','idp','sackPremium'].map(k=>`<label class="gate"><span>${k==='tep'?'TE Premium':k==='idp'?'IDP':k==='sackPremium'?'Sack Premium':'Superflex'}</span><input style="width:auto" type="checkbox" ${c[k]?'checked':''} onchange="cset('${k}',this.checked)"></label>`).join('')}</div><div class="card"><h2>Replacement-Level Points</h2><div class="grid4">${Object.keys(c.replacement).map(k=>`<div class="field"><label>${k}</label><input type="number" value="${c.replacement[k]}" onchange="db.config.replacement['${k}']=Number(this.value);persist()"></div>`).join('')}</div><p class="small">Replacement level is critical. It converts raw projections into points above replacement so scarce positions are valued correctly for your league.</p></div></div><div class="grid" style="margin-top:12px"><div class="card"><h2>Value Engine Weights</h2>${Object.keys(c.weights).map(k=>`<div class="field"><label>${k} (${Math.round(c.weights[k]*100)}%)</label><input type="range" min="0" max="30" value="${c.weights[k]*100}" oninput="db.config.weights['${k}']=Number(this.value)/100;this.previousElementSibling.textContent='${k} ('+this.value+'%)';persist()"></div>`).join('')}</div><div class="card"><h2>Data Controls</h2><button class="secondary" onclick="exportData()">Export Full Backup</button> <button class="secondary" onclick="downloadCSV()">Export Market CSV</button><hr style="border-color:#263753"><button class="danger" onclick="resetAll()">Reset App Database</button><p class="small">Reset returns to the bundled seed database and erases local edits/history from this device.</p><p class="small">App version ${APP_VERSION}</p></div></div>`}
function cset(k,v){db.config[k]=v;persist();document.getElementById('subline').textContent=`${db.config.leagueName} engine • ${db.config.superflex?'SF • ':''}${db.config.tep?'TEP • ':''}${db.config.sackPremium?'sack-premium IDP • ':''}cap/contracts • dynamic asset pricing`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`capitol-carnage-gm-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.assets||!x.config)throw Error('Invalid backup');db=x;persist();renderAssetList();showView('dashboard');alert('Backup restored.')}catch(e){alert('Could not restore: '+e.message)}};r.readAsText(file)}
function downloadCSV(){let cols=['name','type','pos','roster','market','adp','ecr','proj','age','role','trend','risk','liquidity','salary','years'];let rows=[cols.join(','),...db.assets.map(a=>cols.map(k=>JSON.stringify(a[k]??'')).join(','))];let b=new Blob([rows.join('\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ccgm-market-board.csv';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Erase local app data and return to seed database?')){localStorage.removeItem('ccgm_db');db=loadDB();renderAssetList();showView('dashboard')}}
function renderAssetList(){document.getElementById('assetList').innerHTML=db.assets.map(a=>`<option value="${a.name}">`).join('')}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');

async function autoRefreshMFL(){
  try{
    ensureMFLDefaults();
    if(!db.mfl.proxyUrl) return;
    const last=db.lastSync?new Date(db.lastSync).getTime():0;
    const stale=!last || (Date.now()-last)>6*60*60*1000;
    if(stale){
      await syncMFL();
      if(localStorage.getItem('ccgm_view')==='trade') renderTrade();
    }
  }catch(e){console.warn('Background MFL refresh skipped',e)}
}

ensureMFLDefaults();persist();nav();renderAssetList();cset('leagueName',db.config.leagueName);let initial=localStorage.getItem('ccgm_view')||'dashboard';showView(initial);setTimeout(autoRefreshMFL,800);
</script>
