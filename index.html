<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>GMS Locker — GM Sports Assistant</title>
  <meta name="description" content="Fantasy football GM sports assistant for rosters, cap, waivers, trades, picks and league analysis.">
  <link rel="stylesheet" href="styles.css?v=1.1.1">
  <link rel="icon" type="image/png" href="gmslocker-logo.png">
</head>
<body>
  <div class="top-banner">
    <img id="bannerImg" src="gmslocker-logo.png" alt="GMS Locker — GM Sports Assistant" class="banner-logo">
  </div>

  <header class="site-header">
    <div class="brand">
      <img id="brandImg" src="gmslocker-logo.png" alt="GMS Locker" class="brand-logo">
      <div class="brand-text">
        <div class="brand-title">GMS Locker</div>
        <div class="brand-sub">GM SPORTS ASSISTANT · PRIDE DYNASTY · FANTRAX</div>
      </div>
    </div>
    <div class="header-right">
      <div class="asof" id="asof">Connecting…</div>
      <button type="button" class="secondary" id="syncBtn" title="Refresh Fantrax league data">Refresh</button>
      <a class="pv-top" href="https://www.ebay.com/str/pinvaultcollectibles" target="_blank" rel="noopener" title="Pin Vault Collectibles eBay Store">
        <img id="pvImg" src="pinvault-collectibles-logo.png" alt="Pin Vault Collectibles" class="pv-top-logo">
        <span class="pv-top-label">eBay Store →</span>
      </a>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="GMS Locker tools">
    <button type="button" data-view="war">War Room</button>
    <button type="button" data-view="team">My Team</button>
    <button type="button" data-view="teams">Teams</button>
    <button type="button" data-view="cap">Cap / Dead</button>
    <button type="button" data-view="bhs">Buy / Hold / Sell</button>
    <button type="button" data-view="waivers">Waivers</button>
    <button type="button" data-view="trade">Trade Lab</button>
    <button type="button" data-view="analysts">Analysts</button>
    <button type="button" data-view="picks">Picks</button>
    <button type="button" data-view="news">News</button>
    <button type="button" data-view="chat">GM Chat</button>
    <button type="button" data-view="contact">Contact</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <button type="button" class="gm-chat-launcher" id="gmChatLauncher" onclick="if(window.GMS)GMS.openChat()" aria-label="Open GM Chat">
    <span class="gm-chat-launcher-mark" aria-hidden="true">GM</span>
    <span>GM Chat</span>
  </button>

  <main class="main" id="main">
    <div class="loading">Loading GMS Locker…</div>
  </main>

  <footer class="site-footer">
    <div><span class="gold">GMS Locker</span> · Simulate here · Execute in Fantrax</div>
    <div style="margin-top:6px">Pride ain't cheap. · Bylaws-aware · O + IDP</div>
    <div style="margin-top:8px">
      <a href="mailto:gmslocker@gmail.com">gmslocker@gmail.com</a>
      ·
      <a href="mailto:pinvaultcollectibles@gmail.com">pinvaultcollectibles@gmail.com</a>
    </div>
  </footer>

  <script src="fantrax-proxy.js?v=1.1.1"></script>
  <script src="app.js?v=1.1.1"></script>
  <script>
  (function () {
    var btn = document.getElementById("syncBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      if (window.GMS && typeof window.GMS.sync === "function") window.GMS.sync();
    });
  })();
  </script>
</body>
</html>
