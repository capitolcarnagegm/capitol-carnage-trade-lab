.rosterTradeGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rosterPanel{background:#101c2f;border:1px solid #243754;border-radius:14px;padding:12px;min-width:0}
.rosterToolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.rosterToolbar .field{flex:1;min-width:180px}
.posTabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.posTabs button{padding:7px 10px;font-size:12px}
.posTabs button.active{background:#f6a500;color:#06111f}
.rosterList{max-height:540px;overflow:auto;padding-right:3px}
.posGroup{margin:10px 0 14px}
.posTitle{position:sticky;top:0;z-index:2;background:#101c2f;padding:7px 0 5px;color:#9fb2ce;font-weight:800;font-size:12px;letter-spacing:.08em}
.rosterPlayer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid #273a56;background:#0b1628;border-radius:10px;padding:9px;margin:6px 0}
.rosterPlayer .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rosterPlayer .meta{font-size:11px;color:#91a4bf;margin-top:2px}
.rosterPlayer .quick{display:flex;align-items:center;gap:7px}
.rosterPlayer .val{font-weight:900;min-width:62px;text-align:right}
.rosterPlayer button{padding:7px 9px;font-size:11px}
.tradeCart{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cartBox{background:#101c2f;border:1px solid #243754;border-radius:14px;padding:12px}
.cartItem{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid #243754;padding:8px 0}
.cartItem:last-child{border-bottom:0}
.cartItem .smallrow{font-size:11px;color:#91a4bf}
.rosterImpact{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.teamBadge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#182943;border:1px solid #314763;font-size:11px;font-weight:800}
.pickBadge{color:#f6c55b}
@media(max-width:900px){
  .rosterTradeGrid,.tradeCart{grid-template-columns:1fr}
  .rosterImpact{grid-template-columns:1fr 1fr}
  .rosterList{max-height:440px}
}

/* GM'S LOCKER — BLACK / GOLD / WHITE BRAND THEME */
:root{
  --bg:#050505;--panel:#0d0d0d;--panel2:#141414;--line:#3a321e;
  --gold:#d4af37;--gold2:#f1cf62;--text:#ffffff;--muted:#c9c9c9;
}
html,body{background:#050505!important;color:#fff!important}
body{background:linear-gradient(180deg,#050505 0%,#090909 100%)!important}
header,.topbar,nav,.nav,.sidebar{background:#080808!important;border-color:#3a321e!important}
.card,.rosterPanel,.cartBox,.aiResult,.rosterPlayer,.notice,.gate,.metric,
input,select,textarea,.uploadZone{background:#0d0d0d!important;color:#fff!important;border-color:#3a321e!important}
h1,h2,h3,h4,strong,b,.name,label,th,td,p,span,div{color:inherit}
.small,.muted,.meta,.smallrow,.confidence{color:#c9c9c9!important}
button{background:#d4af37!important;color:#050505!important;border-color:#d4af37!important;font-weight:900}
button.secondary,.secondary{background:#151515!important;color:#f1cf62!important;border-color:#6b5720!important}
button.danger,.danger{background:#1b1010!important;color:#fff!important;border-color:#6a3434!important}
button:disabled{opacity:.48}
.pill,.teamBadge,.riskBadge{background:#151515!important;color:#f1cf62!important;border-color:#6b5720!important}
.good,.trendUp{color:#f1cf62!important}.bad,.trendDown{color:#ff8d8d!important}
.vgood{border-color:#d4af37!important;background:#171307!important;color:#fff!important}
.vwarn{border-color:#8a7028!important;background:#171307!important;color:#fff!important}
.vbad{background:#1b1010!important;color:#fff!important}
.balance,.powerBar{background:#252525!important}
.balance:before,.powerBar>i{background:#d4af37!important}
.acceptable{border-color:#d4af37!important}
.needle{background:#fff!important;box-shadow:0 0 0 2px #050505,0 0 0 3px #d4af37!important}
.posTitle{background:#0d0d0d!important;color:#f1cf62!important}
.posTabs button.active{background:#d4af37!important;color:#050505!important}
.rosterPlayer{background:#090909!important}
.uploadZone{border-color:#6b5720!important}
.uploadZone:hover{border-color:#f1cf62!important}
a{color:#f1cf62!important}
input:focus,select:focus,textarea:focus{outline:1px solid #d4af37!important;border-color:#d4af37!important}
::-webkit-scrollbar{background:#080808}::-webkit-scrollbar-thumb{background:#6b5720;border-radius:8px}


/* GM'S LOCKER v3 FRONT OFFICE */
.sourceBadge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.06em;border:1px solid #6b5720;background:#121212;color:#f1cf62}
.sourceBadge.mfl{color:#f1cf62}.sourceBadge.shot{color:#fff;border-color:#8a7028}.sourceBadge.manual{color:#fff;border-color:#777}
.analysisHero{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.strengthGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.strengthCard{border:1px solid #3a321e;background:#0d0d0d;border-radius:12px;padding:10px}
.strengthCard b{font-size:19px;color:#f1cf62}
.teamSelectRow{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.teamSelectRow .field{min-width:240px;flex:1}
.importGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.importZone{border:2px dashed #6b5720;background:#0b0b0b;border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.importZone:hover{border-color:#f1cf62}
.reconTable{width:100%;border-collapse:collapse}
.reconTable th,.reconTable td{padding:8px;border-bottom:1px solid #332b18;font-size:11px;text-align:left}
.conflict{background:#1d1408}
.matchGood{color:#f1cf62;font-weight:900}.matchBad{color:#ff9a9a;font-weight:900}
.percentileBar{height:8px;background:#252525;border-radius:999px;overflow:hidden}.percentileBar i{display:block;height:100%;background:#d4af37}
@media(max-width:900px){.analysisHero{grid-template-columns:1fr 1fr}.strengthGrid,.importGrid{grid-template-columns:1fr}}


/* v3.2 FA BID LAB */
.faMasterGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}
.faFilters{display:grid;grid-template-columns:1.4fr .6fr .6fr .6fr;gap:8px}
.faTable{width:100%;border-collapse:collapse}
.faTable th,.faTable td{padding:8px;border-bottom:1px solid #302815;font-size:11px;text-align:left}
.faTable tbody tr:hover{background:#12100a}
.bidBox{border:1px solid #5a4a1b;background:#0d0d0d;border-radius:14px;padding:14px}
.bidDollar{font-size:42px;font-weight:1000;color:#f1cf62}
.bidFactor{display:grid;grid-template-columns:120px 1fr 42px;gap:8px;align-items:center;margin:7px 0}
.bidFactorBar{height:8px;background:#232323;border-radius:999px;overflow:hidden}
.bidFactorBar i{display:block;height:100%;background:#d4af37}
.bidGrade{display:inline-flex;padding:4px 8px;border-radius:999px;border:1px solid #6b5720;color:#f1cf62;font-weight:900}
@media(max-width:1000px){.faMasterGrid{grid-template-columns:1fr}.faFilters{grid-template-columns:1fr 1fr}}


/* v3.3 SAFARI-SAFE SCREENSHOT UPLOADS */
.nativeUpload{display:block;border:2px dashed #6b5720;background:#0b0b0b;border-radius:14px;padding:16px;text-align:center}
.nativeUpload input[type=file]{display:block;width:100%;margin-top:10px;padding:10px;background:#111;color:#fff;border:1px solid #6b5720;border-radius:10px}
.nativeUpload strong{color:#f1cf62;font-size:13px}
.uploadHint{font-size:10px;color:#aaa;margin-top:5px}


/* v3.4 EDGE FINDER */
.edgeHero{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.edgeGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.edgeCard{border:1px solid #3a321e;background:#0b0b0b;border-radius:14px;padding:12px}
.edgeCard.hot{border-color:#d4af37;box-shadow:0 0 0 1px rgba(212,175,55,.18)}
.edgeType{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:1000;letter-spacing:.07em;background:#171307;color:#f1cf62;border:1px solid #6b5720}
.edgeScore{font-size:26px;font-weight:1000;color:#f1cf62}
.edgeWhy{font-size:11px;color:#ccc;line-height:1.45}
.edgeAction{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid #302815}
.edgeMissing{border:1px solid #6a4a25;background:#1b1209;border-radius:10px;padding:9px;font-size:11px;color:#ffd9a0}
.edgeGood{color:#f1cf62}.edgeBad{color:#ff9797}
.edgeFilterRow{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.edgeFilterRow .field{min-width:170px;flex:1}
@media(max-width:900px){.edgeHero{grid-template-columns:1fr 1fr}.edgeGrid{grid-template-columns:1fr}}


/* v3.5 LIVE DRAFT PICK FORECAST */
.pickBoard{width:100%;border-collapse:collapse}
.pickBoard th,.pickBoard td{padding:9px 8px;border-bottom:1px solid #302815;font-size:11px;text-align:left;vertical-align:middle}
.pickRange{font-weight:1000;color:#f1cf62}
.pickProb{height:8px;background:#242424;border-radius:999px;overflow:hidden;min-width:100px}
.pickProb i{display:block;height:100%;background:#d4af37}
.pickTier{display:inline-flex;padding:3px 7px;border-radius:999px;border:1px solid #6b5720;background:#15120a;color:#f1cf62;font-size:9px;font-weight:900}
.pickOwner{font-weight:900}
.pickOrigin{font-size:10px;color:#aaa}
.forecastGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:900px){.forecastGrid{grid-template-columns:1fr 1fr}.pickBoard th:nth-child(6),.pickBoard td:nth-child(6){display:none}}


/* v3.6 WAR ROOM ACTION CENTER */
.warActionGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.warItem{border-bottom:1px solid #302815;padding:9px 0}
.warItem:last-child{border-bottom:0}
.warScore{font-size:18px;font-weight:1000;color:#f1cf62}
.capSource{display:inline-flex;padding:3px 7px;border-radius:999px;border:1px solid #6b5720;color:#f1cf62;font-size:9px;font-weight:900}
.capFix{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
@media(max-width:900px){.warActionGrid{grid-template-columns:1fr}}


/* v3.7 UNIVERSAL 0–100 SCORING + CORRECTION ACTIONS */
.score100{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:30px;padding:0 8px;border:1px solid #6b5720;border-radius:999px;background:#15120a;color:#f1cf62;font-size:16px;font-weight:1000}
.scoreTrack{height:8px;background:#252525;border-radius:999px;overflow:hidden}
.scoreTrack i{display:block;height:100%;background:#d4af37}
.correctionBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.correctionPanel{border:1px solid #6b5720;background:#0b0b0b;border-radius:14px;padding:12px;margin-top:10px}
.correctionPanel[hidden]{display:none!important}
.correctionLaunch{background:#151515!important;color:#f1cf62!important;border:1px solid #6b5720!important}
.scoreLabel{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:.06em}


/* v3.8 MY ROSTER + IMPORT WORKFLOW */
.rosterGroup{margin-top:12px}
.rosterGroup h3{margin:0 0 8px;color:#f1cf62}
.rosterRow{display:grid;grid-template-columns:1.5fr .5fr .6fr .6fr .6fr .7fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #302815;font-size:11px}
.importSteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.importStep{border:1px solid #3a321e;border-radius:10px;padding:9px;background:#0d0d0d}

.fileSummary{margin-top:8px;font-size:11px;color:#ddd}
@media(max-width:900px){.rosterRow{grid-template-columns:1.2fr .5fr .6fr .7fr}.rosterRow>*:nth-child(5),.rosterRow>*:nth-child(6),.rosterRow>*:nth-child(7){display:none}.importSteps{grid-template-columns:1fr}}


/* v3.9 TRANSACTION MANAGER */
.txGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.txRow{display:grid;grid-template-columns:1.2fr 1fr 1fr .7fr .7fr auto;gap:8px;align-items:end}
.txAsset{border:1px solid #302815;border-radius:10px;padding:9px;margin-top:7px;background:#0b0b0b}
.txLog{border-bottom:1px solid #302815;padding:9px 0;font-size:11px}
@media(max-width:900px){.txGrid,.txRow{grid-template-columns:1fr}}


/* v4.0 TRANSACTION SCREENSHOT IMPORT */
.txShotPanel{border:1px solid #6b5720;background:#0b0b0b;border-radius:14px;padding:12px}
.txShotGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.txDetected{border:1px solid #302815;border-radius:10px;padding:9px;background:#0d0d0d}
.txDetected h4{margin:0 0 6px;color:#f1cf62}
@media(max-width:900px){.txShotGrid{grid-template-columns:1fr}}

.integrityGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.integrityState.bad{color:#ff9a9a;border-color:#6a3434}
.integrityScore{font-size:36px;font-weight:1000;color:#f1cf62}
.dataMatrix{width:100%;border-collapse:collapse}.dataMatrix th,.dataMatrix td{padding:8px;border-bottom:1px solid #302815;text-align:left;font-size:11px}

function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,Number(n)||0))}
function fmt(n){return Math.round(Number(n)||0).toLocaleString()}
function pct(n){return ((Number(n)||0)*100).toFixed(1)+'%'}
function posScarcity(pos){let base={QB:94,RB:80,WR:76,TE:88,EDGE:91,DL:84,LB:77,S:70,CB:58,PICK:78}[pos]||70;if(pos==='QB'&&db.config.superflex)base+=5;if(pos==='TE'&&db.config.tep)base+=5;if((pos==='EDGE'||pos==='DL')&&db.config.sackPremium)base+=6;return clamp(base)}
function ageScore(a){if(!a||a.type==='PICK')return 82;let peak={QB:29,RB:24,WR:26,TE:27,EDGE:27,DL:27,LB:26,S:27,CB:26}[a.pos]||26;let dist=Math.abs((a.age||peak)-peak);return clamp(96-dist*6)}
function replacement(a){return Number(db.config.replacement[a.pos]||0)}
function projectionScore(a){if(a.type==='PICK')return clamp((a.classStrength||75)*.82 + pickSlotScore(a)*.18);let repl=replacement(a);let above=(Number(a.proj)||0)-repl;return clamp(60+above/2.2)}
function pickSlotScore(a){let p=a.slotProb||{};return clamp((p.early||0)*1+(p.mid||0)*.78+(p.late||0)*.58)}
function contractScore(a){if(a.type==='PICK')return 91;if(a.salary===undefined||a.salary==='')return 70;let cap=db.config.salaryCap||1000;let salPct=(Number(a.salary)||0)/cap;let control=Math.min(5,Number(a.years)||0);let prod=projectionScore(a);return clamp(68+prod*.25-salPct*170+control*4.5)}
function roleScore(a){if(a.type==='PICK')return clamp((a.classStrength||75)*.75+pickSlotScore(a)*.25);return clamp(a.role||60)}
function marketScore(a){let m=Number(a.market)||0;return clamp(45+Math.log10(Math.max(1,m))*13)}
function trendScore(a){return clamp(70+(Number(a.trend)||0)*2.2)}
function riskScore(a){return clamp(100-(Number(a.risk)||35))}
function liquidityScore(a){return clamp(a.liquidity||65)}
function arbitrage(a){if(a.type==='PICK')return (modelValue(a)-(Number(a.market)||0))/Math.max(1,Number(a.market)||1);let adpEdge=(a.adp&&a.ecr)?(Number(a.adp)-Number(a.ecr))/Math.max(20,Number(a.adp)):0;let projEdge=(projectionScore(a)-marketScore(a))/100;return adpEdge*.35+projEdge*.65}
function prideScore(a){const w=db.config.weights;return clamp(marketScore(a)*w.market+projectionScore(a)*w.projection+roleScore(a)*w.replacement+contractScore(a)*w.contract+ageScore(a)*w.age+roleScore(a)*w.role+trendScore(a)*w.trend+posScarcity(a.pos)*w.scarcity+liquidityScore(a)*w.liquidity+riskScore(a)*w.risk)}
function pickMultiplier(a){let yearDisc=Math.max(.72,1-(Math.max(0,(Number(a.year)||2027)-2027)*.08));let roundMult={1:1,2:.62,3:.32,4:.16}[a.round]||.12;let cls=(Number(a.classStrength)||75)/85;let slot=(pickSlotScore(a)/78);return yearDisc*roundMult*cls*slot}
function modelValue(a){let base=Number(a.market)||0;if(a.type==='PICK'){let anchor=a.round===1?5400:a.round===2?2500:a.round===3?1100:600;return Math.round((base*.45+anchor*pickMultiplier(a)*.55)*(1+(Number(a.trend)||0)/100))}let score=prideScore(a);let proj=projectionScore(a);let contract=contractScore(a);let arb=arbitrage(a);return Math.max(50,Math.round(base*(.58+score/215)*(1+arb*.12)*(1+(contract-70)/420)*(1+(proj-70)/500)))}
function titleImpact(a){if(a.type==='PICK')return clamp(55+(a.year===2027?10:0));return clamp(projectionScore(a)*.55+roleScore(a)*.25+posScarcity(a.pos)*.2)}
function prongs(a){return {Production:projectionScore(a),'Roster Fit':clamp((titleImpact(a)+posScarcity(a.pos))/2),'Market Timing':trendScore(a),'Contract Value':contractScore(a),'Championship Impact':titleImpact(a),'Cap Leverage':clamp(contractScore(a)*.72+liquidityScore(a)*.28),'Outside Market':liquidityScore(a)}}

function franchiseRecord(team){
  const f=(db.mfl?.franchises||[]).find(x=>String(x.name||'').toLowerCase()===String(team||'').toLowerCase());
  return f||{};
}
function firstFinite(obj,keys){
  for(const k of keys){
    const v=obj?.[k];
    if(v!==undefined&&v!==null&&v!==''){
      const n=Number(String(v).replace(/[$,]/g,''));
      if(Number.isFinite(n))return n;
    }
  }
  return undefined;
}
function teamCapSnapshot(team){
  db.capOverrides=db.capOverrides||{};
  const override=Number(db.capOverrides[team]);
  if(Number.isFinite(override)&&override>=0)return {remaining:override,source:'MANUAL',confidence:'HIGH'};

  const f=franchiseRecord(team);
  const raw=f.raw||f;
  const remaining=firstFinite(raw,[
    'remainingCap','remaining_cap','capRoom','cap_room','availableCap','available_cap',
    'salaryCapAvailable','salary_cap_available','remainingSalaryCap','remaining_salary_cap'
  ]);
  if(remaining!==undefined)return {remaining,source:'MFL',confidence:'HIGH'};

  const spent=teamAssets(team).filter(a=>a.type!=='PICK').reduce((sum,a)=>sum+Number(a.salary||0),0);
  const franchiseLimit=firstFinite(raw,[
    'salaryCapAmount','salary_cap_amount','salaryCap','salary_cap','capLimit','cap_limit'
  ]);
  const leagueLimit=Number(db.config?.salaryCap);
  const limit=Number.isFinite(franchiseLimit)?franchiseLimit:(Number.isFinite(leagueLimit)?leagueLimit:undefined);
  if(limit!==undefined)return {remaining:Math.max(0,limit-spent),source:franchiseLimit!==undefined?'MFL DERIVED':'ESTIMATE',confidence:'MEDIUM',limit,spent};

  return {remaining:0,source:'MISSING',confidence:'LOW',spent};
}

function warRoomFASuggestions(){
  if(typeof scanFreeAgentEdges!=='function')return [];
  return scanFreeAgentEdges().filter(e=>e.complete&&e.type==='FA BUY').sort((a,b)=>b.score-a.score).slice(0,5);
}
function warRoomTradeTargets(){
  const ours=db.config.teamName;
  const teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(n=>n&&n!==ours);
  const positions=['QB','RB','WR','TE','DL','LB','DB'];
  const ourNeeds=positions.map(pos=>({pos,need:rosterNeedScore(ours,pos)})).sort((a,b)=>b.need-a.need);
  const targets=[];
  for(const needRow of ourNeeds.slice(0,4)){
    if(needRow.need<35)continue;
    for(const team of teams){
      const assets=teamAssets(team).filter(a=>a.type!=='PICK'&&normalizedPos(a.pos)===needRow.pos);
      for(const a of assets){
        const comp=dataCompleteness(a);
        if(comp.missing.includes('projection'))continue;
        const proj=Number(a.proj||0),role=Number(a.role||50),risk=Number(a.risk||45);
        const salary=Number(a.salary||0),mv=modelValue(a),market=Number(a.market||0);
        const capEff=proj?Math.max(0,100-Math.min(100,(salary/proj)*110)):50;
        const marketEdge=market>0?Math.max(-30,Math.min(30,(mv-market)/market*100)):0;
        const ownerNeed=rosterNeedScore(team,a.pos);
        // We prefer players helping our weakness whose owner has enough depth that a deal is plausible.
        const availability=Math.max(0,100-ownerNeed);
        const score=needRow.need*.30+Math.min(100,proj/2.1)*.20+role*.13+(100-risk)*.09+capEff*.10+availability*.12+(50+marketEdge)*.06;
        if(score>=63)targets.push({a,team,pos:needRow.pos,ourNeed:needRow.need,ownerNeed,score:Math.round(score),capEff});
      }
    }
  }
  return targets.sort((a,b)=>b.score-a.score).slice(0,7);
}
function warPickEdges(){
  if(typeof scanPickEdges!=='function')return [];
  return scanPickEdges().sort((a,b)=>b.score-a.score).slice(0,4);
}

function transactionAssets(){

function txAssetById(id){
  return (db.assets||[]).find(a=>String(a.id)===String(id)||String(a.mflId||'')===String(id));

function ensureTxLog(){
  db.manualTransactions=db.manualTransactions||[];
  return db.manualTransactions;

function applyOwnershipMove(asset,toTeam,opts={}){
  if(!asset||!toTeam)return false;
  const oldTeam=asset.roster||'FREE AGENT';
  asset.roster=toTeam;
  asset.owner=toTeam;
  if(asset.type==='PICK')asset.currentOwner=toTeam;
  if(opts.salary!==undefined&&opts.salary!=='')asset.salary=Number(opts.salary);
  if(opts.years!==undefined&&opts.years!=='')asset.years=Number(opts.years);
  asset.source='Manual Transaction';
  asset.sources=asset.sources||{};
  asset.sources.roster='Manual Transaction';
  if(opts.salary!==undefined&&opts.salary!=='')asset.sources.salary='Manual Transaction';
  if(opts.years!==undefined&&opts.years!=='')asset.sources.years='Manual Transaction';
  asset.lastReason=`Manual transaction: ${oldTeam} → ${toTeam}`;
  return oldTeam;
}
function addManualTransaction(){saveUndoPoint('Before manual transaction');
  const type=document.getElementById('txType')?.value||'TRADE';
  const assetId=document.getElementById('txAsset')?.value||'';
  const from=document.getElementById('txFrom')?.value||'';
  const to=document.getElementById('txTo')?.value||'';
  const salary=document.getElementById('txSalary')?.value;
  const years=document.getElementById('txYears')?.value;
  const asset=txAssetById(assetId);
  if(!asset)return alert('Choose an asset.');
  if(!to)return alert('Choose the destination team.');
  if(from && asset.roster && String(asset.roster)!==String(from)){
    const ok=confirm(`${asset.name} is currently listed on ${asset.roster}, not ${from}. Move him anyway?`);
    if(!ok)return;
  }
  const oldTeam=applyOwnershipMove(asset,to,{salary,years});
  ensureTxLog().unshift({
    id:uid('tx'),
    date:new Date().toISOString(),
    type,
    assetId:asset.id,
    assetName:asset.name,
    from:oldTeam||from||'Unknown',
    to,
    salary:salary!==''?Number(salary):undefined,
    years:years!==''?Number(years):undefined,
    source:'Manual Transaction'
  });
  persist();
  renderAssetList();
  renderTransactions();
  if(document.getElementById('myroster')?.classList.contains('active'))renderMyRoster();
  alert(`${asset.name} moved from ${oldTeam||from||'Unknown'} to ${to}.`);
}
function addTradePair(){saveUndoPoint('Before manual trade');

  const recv=document.getElementById('txRecvAsset')?.value||'';
  const teamA=document.getElementById('txTeamA')?.value||'';
  const teamB=document.getElementById('txTeamB')?.value||'';
  if(!teamA||!teamB||teamA===teamB)return alert('Choose two different teams.');
  const a=txAssetById(give),b=txAssetById(recv);
  if(!a&&!b)return alert('Choose at least one asset.');
  const log=ensureTxLog();
  const batch=uid('trade');
  if(a){
    const old=applyOwnershipMove(a,teamB,{});
    log.unshift({id:uid('tx'),batch,date:new Date().toISOString(),type:'TRADE',assetId:a.id,assetName:a.name,from:old||teamA,to:teamB,source:'Manual Transaction'});
  }
  if(b){
    const old=applyOwnershipMove(b,teamA,{});
    log.unshift({id:uid('tx'),batch,date:new Date().toISOString(),type:'TRADE',assetId:b.id,assetName:b.name,from:old||teamB,to:teamA,source:'Manual Transaction'});
  }
  audit('MANUAL TRANSACTION',{asset:asset?.name||'',to},'Transaction Manager');persist();renderAssetList();renderTransactions();
  if(document.getElementById('myroster')?.classList.contains('active'))renderMyRoster();
  alert('Trade transaction applied.');
}

function resolveTxAsset(name,team){
  const n=String(name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const pool=transactionAssets();
  return pool.find(a=>String(a.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')===n && (!team || String(a.roster||'').toLowerCase()===String(team).toLowerCase()))
      || pool.find(a=>String(a.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')===n)
      || pool.find(a=>String(a.name||'').toLowerCase().includes(String(name||'').toLowerCase()));
}

function applyTransactionScreenshotImports(){saveUndoPoint('Before screenshot transaction import');
  const rows=window.pendingTransactionImports||[];
  if(!rows.length)return;
  const log=ensureTxLog();
  let moved=0,unresolved=[];
  for(const t of rows){
    const type=t.type||'TRADE',teamA=t.teamA||'',teamB=t.teamB||'';
    for(const name of (t.teamASends||[])){
      const a=resolveTxAsset(name,teamA);
      if(!a){unresolved.push(`${name} (${teamA} → ${teamB})`);continue}
      const old=applyOwnershipMove(a,teamB,{});
      log.unshift({id:uid('tx'),date:new Date().toISOString(),type,assetId:a.id,assetName:a.name,from:old||teamA,to:teamB,source:'Screenshot Transaction'});
      moved++;
    }
    for(const name of (t.teamBSends||[])){
      const a=resolveTxAsset(name,teamB);
      if(!a){unresolved.push(`${name} (${teamB} → ${teamA})`);continue}
      const old=applyOwnershipMove(a,teamA,{});
      log.unshift({id:uid('tx'),date:new Date().toISOString(),type,assetId:a.id,assetName:a.name,from:old||teamB,to:teamA,source:'Screenshot Transaction'});
      moved++;
    }
  }
  persist();renderAssetList();renderTransactions();
  window.pendingTransactionImports=[];
  alert(`${moved} asset move${moved===1?'':'s'} applied.${unresolved.length?`\nUnresolved: ${unresolved.join(', ')}`:''}`);
}

function integrityIssues(){
  const issues=[],assets=db.assets||[],teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(Boolean);
  const byMfl=new Map(),byName=new Map();
  for(const a of assets.filter(x=>x.type==='PLAYER')){
    if(a.mflId){const k=String(a.mflId);if(!byMfl.has(k))byMfl.set(k,[]);byMfl.get(k).push(a)}
    const nk=String(a.name||'').toLowerCase().trim();if(nk){if(!byName.has(nk))byName.set(nk,[]);byName.get(nk).push(a)}
  }
  for(const [id,arr] of byMfl){
    if(arr.length>1){const rosters=[...new Set(arr.map(a=>a.roster).filter(Boolean))];issues.push({severity:'critical',type:'DUPLICATE PLAYER',asset:arr[0]?.name||id,message:`MFL player ${id} appears ${arr.length} times${rosters.length>1?` across ${rosters.join(', ')}`:''}.`,action:'RECONCILE OWNERSHIP'})}
  }
  for(const [name,arr] of byName){
    const ids=[...new Set(arr.map(a=>a.mflId).filter(Boolean))];if(arr.length>1&&ids.length>1)issues.push({severity:'high',type:'NAME COLLISION',asset:arr[0]?.name||name,message:'Multiple MFL IDs share this player name.',action:'REVIEW PLAYER MATCH'})
  }
  for(const a of assets.filter(x=>x.type==='PLAYER'&&x.roster&&String(x.roster).toUpperCase()!=='FREE AGENT')){
    if(!(Number(a.proj)>0))issues.push({severity:'high',type:'MISSING PROJECTION',asset:a.name,message:`${a.roster} · ${normalizedPos(a.pos)} has no usable projection.`,action:'ADD PROJECTION'});
    if(a.salary===undefined||a.salary===null||a.salary==='')issues.push({severity:'medium',type:'MISSING SALARY',asset:a.name,message:`${a.roster} has no salary recorded.`,action:'CORRECT CONTRACT'});
  }
  for(const team of teams){const snap=teamCapSnapshot(team);if(snap.source==='MISSING')issues.push({severity:'high',type:'CAP DATA',asset:team,message:'No trustworthy remaining-cap value is available.',action:'SET CAP OVERRIDE'})}
  const picks=(typeof livePickForecasts==='function'?livePickForecasts():[]);
  for(const q of picks){
    if(!q.currentOwner||q.currentOwner==='Unknown')issues.push({severity:'high',type:'PICK OWNER',asset:`${q.year} R${q.round}`,message:'Current owner is unknown.',action:'CORRECT PICK OWNER'});
    if(!q.originalTeam||q.originalTeam==='Unknown')issues.push({severity:'high',type:'PICK ORIGIN',asset:`${q.year} R${q.round}`,message:'Original franchise is unknown, so slot forecast is unreliable.',action:'SET ORIGINAL TEAM'});
  }
  for(const tx of (db.manualTransactions||[])){const a=(db.assets||[]).find(x=>String(x.id)===String(tx.assetId));if(a&&tx.to&&String(a.roster)!==String(tx.to))issues.push({severity:'critical',type:'TRANSACTION CONFLICT',asset:a.name,message:`Latest manual transaction says ${tx.to}, but asset currently says ${a.roster}.`,action:'APPLY LATEST TRANSACTION'})}
  return issues;
}
function integrityScore(){
  let score=100;const penalty={critical:18,high:8,medium:3,low:1};integrityIssues().forEach(i=>score-=penalty[i.severity]||2);return score100(score);
}
function dataCompletenessMatrix(){
  const owned=(db.assets||[]).filter(a=>a.type==='PLAYER'&&a.roster&&String(a.roster).toUpperCase()!=='FREE AGENT');
  const pct=f=>owned.length?Math.round(100*owned.filter(f).length/owned.length):0;
  const picks=(db.assets||[]).filter(a=>a.type==='PICK');
  return [
    {name:'Roster ownership',score:pct(a=>!!a.roster)},{name:'Projections',score:pct(a=>Number(a.proj)>0)},
    {name:'Salary',score:pct(a=>a.salary!==undefined&&a.salary!==null&&a.salary!=='')},{name:'Contract years',score:pct(a=>a.years!==undefined&&a.years!==null&&a.years!=='')},
    {name:'Role score',score:pct(a=>a.role!==undefined&&a.role!==null)},{name:'Risk score',score:pct(a=>a.risk!==undefined&&a.risk!==null)},
    {name:'Pick ownership',score:picks.length?Math.round(100*picks.filter(a=>a.roster||a.owner||a.currentOwner).length/picks.length):0},
    {name:'Pick original team',score:picks.length?Math.round(100*picks.filter(a=>a.originalTeam||a.originalOwner||a.fromTeam||a.pickTeam).length/picks.length):0}
  ];
}

  const req=starterRequirements(),roster=teamAssets(team).filter(a=>a.type!=='PICK'&&!/(IR|RESERVE|MINOR|TAXI)/.test(String(a.status||a.rosterStatus||'').toUpperCase()));

    pool.slice(0,n).forEach((a,i)=>out.push({slot:`${pos}${n>1?i+1:''}`,a}));

  const total=exps.reduce((s,x)=>s+x,0)||1;
  return power.map((x,i)=>({...x,titleOdds:Math.round(1000*exps[i]/total)/10,playoffOdds:score100(35+(x.powerPct-50)*1.25)}));
}

/* ---------- V6 OWNER TENDENCIES / FA AUCTION INTELLIGENCE ---------- */
function auctionAmount(raw){
  const keys=['bbid','blindBid','blind_bid','bid','bidAmount','bid_amount','amount','price','salary'];
  for(const k of keys){const n=Number(String(raw?.[k]??'').replace(/[$,]/g,''));if(Number.isFinite(n)&&n>0)return n}
  return 0;
}
function rebuildAuctionHistory(){
  const hist=[];
  for(const t of (db.mfl?.transactions||[])){
    const raw=t.raw||{};const amt=auctionAmount(raw);
    const typ=String(t.type||raw.type||'').toLowerCase();
    if(amt>0||/waiver|blind|bid|free agent|add/.test(typ)){
      const a=(db.assets||[]).find(x=>String(x.name||'').toLowerCase()===String(t.player||'').toLowerCase());
      hist.push({time:t.timestamp||'',team:t.franchise||'',player:t.player||'',pos:normalizedPos(a?.pos||''),amount:amt,type:t.type||'',raw});
    }
  }
  db.mfl.auctionHistory=hist;
  return hist;
}
function ownerTendencies(){
  const hist=rebuildAuctionHistory(),teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(Boolean);
  return teams.map(team=>{
    const bids=hist.filter(x=>x.team===team&&x.amount>0),avg=bids.length?bids.reduce((s,x)=>s+x.amount,0)/bids.length:0,max=bids.length?Math.max(...bids.map(x=>x.amount)):0;
    const tx=(db.mfl?.transactions||[]).filter(x=>x.franchise===team).length;
    const cap=teamCapSnapshot(team).remaining;
    const aggressiveness=score100(Math.min(100,bids.length*6+avg*1.4+max*.45));
    return {team,bids:bids.length,avg,max,tx,cap,aggressiveness};
  }).sort((a,b)=>b.aggressiveness-a.aggressiveness);
}
function leagueAuctionPressure(pos){
  const hist=rebuildAuctionHistory().filter(x=>x.amount>0&&(!pos||x.pos===normalizedPos(pos)));
  if(!hist.length)return {avg:0,p75:0,max:0,count:0};
  const vals=hist.map(x=>x.amount).sort((a,b)=>a-b);const q=p=>vals[Math.min(vals.length-1,Math.floor((vals.length-1)*p))];
  return {avg:vals.reduce((s,x)=>s+x,0)/vals.length,p75:q(.75),max:vals[vals.length-1],count:vals.length};
}

function postTradeImpact(){
  const get=tradeState.receive.map(tradeAsset).filter(Boolean);
  const give=tradeState.give.map(tradeAsset).filter(Boolean);
  const points=get.reduce((s,a)=>s+(Number(a.proj)||0),0)-give.reduce((s,a)=>s+(Number(a.proj)||0),0);
  const salary=get.reduce((s,a)=>s+(Number(a.salary)||0),0)-give.reduce((s,a)=>s+(Number(a.salary)||0),0);
  const value=get.reduce((s,a)=>s+modelValue(a),0)-give.reduce((s,a)=>s+modelValue(a),0);

  const warnings=[];
  const our=teamAssets(db.config.teamName).filter(a=>a.type!=='PICK');
  const giveIds=new Set(give.map(a=>a.id));
  const getPlayers=get.filter(a=>a.type!=='PICK');
  for(const pos of ['QB','RB','WR','TE','DL','LB','DB']){
    const before=our.filter(a=>assetPos(a)===pos).length;
    const outgoing=give.filter(a=>assetPos(a)===pos && a.type!=='PICK').length;
    const incoming=getPlayers.filter(a=>assetPos(a)===pos).length;
    const after=before-outgoing+incoming;
    if(before>=2 && after<2) warnings.push(`${pos} depth falls to ${after}`);
    if(before===1 && after===0) warnings.push(`${pos} room becomes empty`);
  }

}
function tradeAnalysis(){

  let pass=0;
  let prongRows=prongKeys.map(k=>{

    return `<div class="gate"><span><b>${k}</b><br><span class="small">Receive ${rv.toFixed(0)} vs Give ${gv.toFixed(0)}</span></span><b class="${p?'good':'bad'}">${p?'PASS':'FAIL'} ${rv>=gv?'▲':'▼'}</b></div>`
  }).join('');
  let gates=[r>=g*.95,sideAvgProng('receive','Roster Fit')>=sideAvgProng('give','Roster Fit'),sideAvgProng('receive','Contract Value')>=sideAvgProng('give','Contract Value')-5,sideAvgProng('receive','Outside Market')>=sideAvgProng('give','Outside Market')-5];
  let gc=gates.filter(Boolean).length,majority=pass>=db.config.requiredProngs,hard=gc>=db.config.hardReq;
  let grade=edge>=.18?'A+':edge>=.12?'A':edge>=.07?'A-':edge>=.03?'B+':edge>=0?'B':edge>=-.04?'B-':edge>=-.08?'C+':'C';

  let vc=verdict.includes('ACCEPT')||verdict==='APPROVE'?'vgood':verdict==='REJECT'?'vbad':'vwarn';

}

function nflWeekEstimate(){const d=new Date(),y=d.getFullYear(),kickoff=new Date(`${y}-09-03T00:00:00`);if(d<kickoff)return 0;return clamp(Math.floor((d-kickoff)/(7*86400000))+1,1,18)}

function playerProduction(a){const w=weeklyVector(a);return w.length?w.reduce((s,x)=>s+x,0):Number(a.actual||a.ytd||0)}
function teamMetrics(team){const starters=teamStarterPool(team),roster=teamAssets(team).filter(a=>a.type!=='PICK'),projected=starters.reduce((s,a)=>s+Number(a.proj||0),0),actual=starters.reduce((s,a)=>s+playerProduction(a),0),pw=currentProductionWeight(),wk=nflWeekEstimate(),ann=(wk&&actual)?actual/wk*17:0,blend=projected*(1-pw)+(ann||projected)*pw,vol=starters.length?starters.reduce((s,a)=>s+playerVolatility(a),0)/starters.length:0,floor=blend*(1-clamp(vol*.38,.05,.32)),ceiling=blend*(1+clamp(vol*.52,.08,.45)),asset=roster.reduce((s,a)=>s+modelValue(a),0),label=vol<.28?'STABLE':vol<.48?'MIXED':'BOOM/BUST';return{team,projected,actual,blend,vol,floor,ceiling,asset,label,score:blend+asset*.002}}

function dataCompleteness(a){
  const missing=[];
  if(!(Number(a?.proj)>0))missing.push('projection');
  if(a?.role===undefined||a?.role===null)missing.push('role');
  if(a?.risk===undefined||a?.risk===null)missing.push('risk');
  if(!(Number(a?.market)>0))missing.push('market value');
  return {missing,score:Math.max(0,100-missing.length*25)};
}
function rosterNeedScore(team,pos){
  const p=normalizedPos(pos),roster=teamAssets(team).filter(a=>a.type!=='PICK'&&normalizedPos(a.pos)===p);
  const usable=roster.filter(a=>Number(a.proj||0)>0).sort((a,b)=>Number(b.proj||0)-Number(a.proj||0));
  const desired={QB:3,RB:5,WR:6,TE:3,DL:4,LB:4,DB:4}[p]||3;
  const depthNeed=Math.max(0,(desired-roster.length)/desired);
  const topNeed=usable.length?Math.max(0,1-(usable[0].proj/({QB:270,RB:180,WR:190,TE:160,DL:140,LB:145,DB:130}[p]||160))):1;
  return Math.round(Math.min(100,(depthNeed*.55+topNeed*.45)*100));
}
function teamRemainingCap(team){
  return Number(teamCapSnapshot(team).remaining||0);
}
function leagueBidPressureFor(a){
  const teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(n=>n&&n!==db.config.teamName);
  const competitors=teams.map(team=>{
    const need=rosterNeedScore(team,a.pos);
    const cap=teamRemainingCap(team);
    const capFactor=Math.min(100,cap/Math.max(1,Number(db.config?.salaryCap||db.config?.cap||1000))*300);
    return {team,need,cap,pressure:need*.7+capFactor*.3};
  }).sort((x,y)=>y.pressure-x.pressure);
  const hot=competitors.filter(x=>x.need>=55&&x.cap>0);
  const pressure=competitors.length?competitors.slice(0,5).reduce((s,x)=>s+x.pressure,0)/Math.min(5,competitors.length):0;
  return {pressure:Math.round(pressure),competitors:hot.slice(0,5)};
}
function edgeGrade(score,complete=true){
  if(!complete)return 'INC';
  return score>=92?'A+':score>=86?'A':score>=80?'A-':score>=74?'B+':score>=68?'B':score>=62?'B-':'C';
}
function makeEdge(type,a,score,title,why,action,extra={}){
  const comp=dataCompleteness(a);
  const complete=comp.missing.length===0 || type==='SHOP' || type==='CAP';
  return {type,a,score:Math.round(score),grade:edgeGrade(score,complete),title,why,action,complete,missing:comp.missing,...extra};
}
function scanFreeAgentEdges(){
  const fa=deriveLeagueFreeAgents();
  const out=[];
  for(const a of fa.slice(0,700)){
    const c=dataCompleteness(a);
    const need=rosterNeedScore(db.config.teamName,a.pos);
    const pressure=leagueBidPressureFor(a);
    const proj=Number(a.proj||0),role=Number(a.role||50),risk=Number(a.risk||45),market=Number(a.market||0);
    const breakout=Math.max(0,Math.min(100,35+(100-risk)*.2+(role-50)*.35+Number(a.trend||0)*3));
    const projNorm=Math.min(100,proj/({QB:3,RB:2,WR:2.2,TE:1.8,DL:1.6,LB:1.7,DB:1.5}[normalizedPos(a.pos)]||2));
    const score=projNorm*.30+role*.17+breakout*.18+need*.18+(100-risk)*.09+(100-pressure.pressure)*.08;
    if(c.missing.includes('projection')){
      if(role>=65||breakout>=65){
        out.push(makeEdge('WATCH',a,Math.min(79,score),`${a.name}: upside signal, projection missing`,
          `Role ${role}/100 and breakout proxy ${Math.round(breakout)}% are interesting, but the projection layer is incomplete.`,
          'COMPLETE DATA', {need,pressure,breakout}));
      }
      continue;
    }
    if(score>=72){
      const bid=blindBidModel(a);
      out.push(makeEdge('FA BUY',a,score,`${a.name}: free-agent value anomaly`,
        `Projection ${Math.round(proj)} · role ${role}/100 · breakout ${Math.round(breakout)}% · our ${normalizedPos(a.pos)} need ${need}/100 · league bid pressure ${pressure.pressure}/100.`,
        `TARGET $${bid.target} · MAX $${bid.ceiling}`, {need,pressure,breakout,bid}));
    }
  }
  return out;
}
function scanRosterSellEdges(){
  const ours=teamAssets(db.config.teamName).filter(a=>a.type!=='PICK');
  const out=[];
  for(const a of ours){
    const modeled=modelValue(a),market=Number(a.market||0),proj=Number(a.proj||0);
    const need=rosterNeedScore(db.config.teamName,a.pos);
    if(market>0 && modeled>0){
      const premium=(market-modeled)/modeled;
      if(premium>=.16 && need<65){
        const score=Math.min(98,70+premium*70+(65-need)*.16);
        out.push(makeEdge('SHOP',a,score,`${a.name}: market may be paying a premium`,
          `External market is ${Math.round(premium*100)}% above GM's Locker modeled value while our ${normalizedPos(a.pos)} need is only ${need}/100.`,
          'SHOP / SELL HIGH',{premium,need}));
      }
    }
    if(proj>0 && Number(a.salary||0)>0){
      const cpp=Number(a.salary)/proj;
      if(cpp>.55 && need<60){
        const score=Math.min(90,68+(cpp-.55)*35+(60-need)*.14);
        out.push(makeEdge('CAP',a,score,`${a.name}: cap-efficiency warning`,
          `$${Number(a.salary).toFixed(2)} salary against ${Math.round(proj)} projected points creates a weak dollars-per-point profile.`,
          'SEEK CHEAPER REPLACEMENT',{cpp,need}));
      }
    }
  }
  return out;
}
function scanTradePartnerEdges(){
  const teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(n=>n&&n!==db.config.teamName);
  const ours=teamAssets(db.config.teamName).filter(a=>a.type!=='PICK');
  const out=[];
  for(const team of teams){
    for(const pos of ['QB','RB','WR','TE','DL','LB','DB']){
      const theirNeed=rosterNeedScore(team,pos);
      const ourNeed=rosterNeedScore(db.config.teamName,pos);
      if(theirNeed>=70 && ourNeed<=45){
        const surplus=ours.filter(a=>normalizedPos(a.pos)===pos).sort((a,b)=>modelValue(b)-modelValue(a));
        if(surplus.length){
          const a=surplus[Math.min(surplus.length-1,2)];
          const score=Math.min(92,72+(theirNeed-70)*.35+(45-ourNeed)*.25);
          out.push(makeEdge('TRADE',a,score,`${team} has a ${pos} pressure point`,
            `${team}'s ${pos} need scores ${theirNeed}/100 while ours is ${ourNeed}/100. That creates a natural market for ${a.name} or another ${pos} surplus asset.`,
            `OPEN ${team} TRADE LAB`,{partner:team,theirNeed,ourNeed}));
        }
      }
    }
  }
  return out;
}

function scanPickEdges(){
  const out=[];
  for(const p of livePickForecasts()){
    const current=Number(p.market||modelValue(p)||0);
    const fair=Number(p.value||0);
    if(!fair)continue;
    const delta=current?((fair-current)/current):0;
    if(delta>=.15){
      out.push(makeEdge('PICK BUY',p,Math.min(96,76+delta*45),`${p.year} R${p.round} (${p.originalTeam}): pick upside`,
        `Current owner ${p.currentOwner}. Original team projects to slot ${p.slot} with range ${p.low}–${p.high}. Live pick value is ${fmt(fair)} versus current modeled/market ${fmt(current)}.`,
        `TARGET AS ${p.tier} PICK`,{pick:p,delta}));
    }else if(delta<=-.18){
      out.push(makeEdge('PICK SELL',p,Math.min(94,75+Math.abs(delta)*40),`${p.year} R${p.round} (${p.originalTeam}): downside risk`,
        `Original team currently projects to slot ${p.slot} (${p.low}–${p.high}). Current market/model may be pricing this pick too optimistically.`,
        `SHOP BEFORE SLOT FALLS`,{pick:p,delta}));
    }
  }
  return out;
}

function allEdges(){
  return [...scanFreeAgentEdges(),...scanRosterSellEdges(),...scanTradePartnerEdges(),...scanPickEdges()]
    .sort((a,b)=>b.score-a.score);

function mflPlayerUniverse(){
  const raw=db.mfl?.rawPlayers||db.mfl?.playersRaw||db.mfl?.players||{};
  if(Array.isArray(raw)) return raw;
  if(Array.isArray(raw?.players?.player)) return raw.players.player;
  if(Array.isArray(raw?.player)) return raw.player;
  if(raw?.players?.player && typeof raw.players.player==='object') return Object.values(raw.players.player);
  if(raw && typeof raw==='object'){
    const vals=Object.values(raw);
    if(vals.length && vals.some(v=>v&&typeof v==='object')) return vals;
  }
  return [];
}
function ownedLeaguePlayerIds(){
  const ids=new Set();
  for(const a of (db.assets||[])){
    const r=String(a.roster||'').toUpperCase();
    if(r && r!=='FREE AGENT' && r!=='FA'){
      if(a.mflId) ids.add(String(a.mflId));
      if(String(a.id||'').match(/^\d+$/)) ids.add(String(a.id));
    }
  }
  return ids;
}
function activeFantasyPlayer(p){
  const pos=String(p.position||p.pos||'').toUpperCase();
  if(!['QB','RB','WR','TE','DL','DE','DT','LB','CB','S','DB','K','PK'].includes(pos)) return false;
  const st=String(p.status||p.playerStatus||'').toLowerCase();
  if(/retired|inactive permanently/.test(st)) return false;
  return !!(p.id||p.player_id||p.name);
}
function deriveLeagueFreeAgents(){
  const owned=ownedLeaguePlayerIds();
  const byMfl=new Map((db.assets||[]).filter(a=>a.mflId).map(a=>[String(a.mflId),a]));
  const byName=new Map((db.assets||[]).map(a=>[String(a.name||'').toLowerCase(),a]));
  const out=[];
  for(const p of mflPlayerUniverse()){
    const id=String(p.id||p.player_id||p.playerId||'');
    if(id && owned.has(id)) continue;
    if(!activeFantasyPlayer(p)) continue;
    const name=p.name||p.fullName||p.player_name||'';
    if(!name) continue;
    const local=byMfl.get(id)||byName.get(String(name).toLowerCase());
    if(local){
      const r=String(local.roster||'').toUpperCase();
      if(r && r!=='FREE AGENT' && r!=='FA') continue;
    }
    out.push({
      id:id||local?.id||name,
      mflId:id,
      name,
      pos:String(p.position||p.pos||local?.pos||'').toUpperCase(),
      nfl:String(p.team||p.nflTeam||local?.nfl||''),
      age:Number(p.age||local?.age||0),
      proj:Number(p.proj||p.projectedPoints||local?.proj||0),
      role:Number(local?.role||50),
      trend:Number(local?.trend||0),
      risk:Number(local?.risk||45),
      market:Number(local?.market||0),
      roster:'FREE AGENT',
      source:local?.source||'MFL'
    });
  }
  if(!out.length){
    for(const a of (db.assets||[])){
      const r=String(a.roster||'').toUpperCase();
      if(r==='FREE AGENT'||r==='FA') out.push({...a});
    }
  }
  return out.sort((a,b)=>(Number(b.proj||0)-Number(a.proj||0))||(modelValue(b)-modelValue(a)));
}

function blindBidModel(a,ov={}){
  const pos=normalizedPos(a?.pos||ov.pos||'WR');
  const proj=Math.max(0,Number(ov.proj??a?.proj??0));
  const role=score100(Number(ov.role??a?.role??50));
  const sentiment=score100(Number(ov.sentiment??(a?.sentiment??(50+Number(a?.trend||0)*3))));
  const breakout=score100(Number(ov.breakout??a?.breakout??Math.max(15,Math.min(85,35+(100-Number(a?.risk||45))*.2+(role-50)*.35))));
  const security=score100(Number(ov.security??(100-Number(a?.risk||45))));
  const age=Number(ov.age??a?.age??25);
  const capSnap=teamCapSnapshot(db.config.teamName);
  const budget=Math.max(1,Number(ov.budget??capSnap.remaining??db.config?.faBudget??100));
  const baseline={QB:260,RB:150,WR:165,TE:145,DL:120,LB:130,DB:115}[pos]||150;
  const scarcity={QB:1.18,RB:1.24,WR:1.00,TE:1.12,DL:1.10,LB:1.05,DB:.92}[pos]||1;
  const production=Math.max(.15,Math.min(1.6,proj/baseline));
  const roleM=.55+role/100*.75,sentM=.82+sentiment/100*.36,breakM=.82+breakout/100*.50,secM=.78+security/100*.42;
  let ageM=1;if(pos==='RB')ageM=age<=24?1.08:age<=27?1:age<=29?.90:.75;else if(['WR','TE'].includes(pos))ageM=age<=25?1.06:age<=29?1:age<=31?.92:.82;else if(pos==='QB')ageM=age<=30?1.03:age<=34?1:.92;else ageM=age<=27?1.04:age<=30?1:.90;

  const need=rosterNeedScore(db.config.teamName,pos);
  const auction=leagueAuctionPressure(pos);
  const owners=ownerTendencies().filter(o=>o.team!==db.config.teamName&&o.cap>0);
  const likely=owners.filter(o=>rosterNeedScore(o.team,pos)>=50).sort((x,y)=>y.aggressiveness-x.aggressiveness||y.cap-x.cap);
  const leaguePressure=likely.length?Math.round(likely.slice(0,5).reduce((z,o)=>z+o.aggressiveness,0)/Math.min(5,likely.length)):0;

  let pct=.014+.085*production*roleM*sentM*breakM*secM*scarcity*ageM;
  pct*=.78+need/100*.45;
  pct*=.88+leaguePressure/100*.30;
  pct=Math.max(.004,Math.min(.38,pct));
  let intrinsic=Math.max(1,Math.round(budget*pct));

  // Historical blind-bid market creates a floor/anchor only when MFL exposed actual amounts.
  const marketAnchor=auction.count?Math.max(1,Math.round(auction.p75*(.55+production*.30)*(0.8+need/100*.3))):0;
  let target=Math.max(intrinsic,marketAnchor);
  target=Math.min(Math.max(1,Math.round(budget*.50)),target);
  const floor=Math.max(1,Math.round(target*.70));
  const ceiling=Math.min(Math.max(target,Math.round(target*1.30)),Math.max(1,Math.round(budget*.60)));
  const opportunityCost=score100((target/budget)*100);
  const score=Math.round(Math.min(100,production*27+role*.18+sentiment*.10+breakout*.16+security*.09+need*.10+(100-opportunityCost)*.04+scarcity/1.24*6));
  const grade=score>=88?'A+':score>=82?'A':score>=76?'A-':score>=70?'B+':score>=64?'B':score>=58?'B-':'C';
  return {target,floor,ceiling,score,grade,proj,role,sentiment,breakout,security,pos,scarcity,need,auction,leaguePressure,likelyBidders:likely.slice(0,5),budget,opportunityCost,capSource:capSnap.source};
}function selectFABidPlayer(id){
  const arr=deriveLeagueFreeAgents();
  window.faSelectedPlayer=arr.find(a=>String(a.mflId||a.id)===String(id))||null;
  renderFABidPanel();
}

function prospectValue(p){let posP={QB:1.15,RB:.95,WR:1.08,TE:.82,EDGE:.85,DL:.72,LB:.65,S:.58,CB:.5}[p.pos]||.65;let score=(p.nflDraftCapital*.28+p.production*.24+p.athletic*.12+p.earlyDeclare*.10+p.competition*.10+(100-p.risk)*.16);return Math.round(6200*posP*(score/90)*(1+(100-Math.min(100,p.rank*4))/450))}

function teamStandingRow(team){
  const arr=db.mfl?.standings||[];
  const s=arr.find(x=>String(x.franchise||x.name||'').toLowerCase()===String(team||'').toLowerCase())||{};
  return {
    wins:Number(s.wins??s.h2hw??s.w??0),
    losses:Number(s.losses??s.h2hl??s.l??0),
    points:Number(s.points??s.pf??s.points_for??0)
  };
}
function pickTeamStrength(team){
  const tm=typeof fullTeamProfile==='function'?fullTeamProfile(team):null;
  const st=teamStandingRow(team);
  const games=st.wins+st.losses;
  const winPct=games?st.wins/games:.5;
  const power=tm?.score||tm?.blend||0;
  const proj=tm?.projected||0;
  return {team,st,games,winPct,power,proj};
}
function leagueFinishForecast(){
  const teams=(db.mfl?.franchises||[]).map(f=>f.name).filter(Boolean);
  const rows=teams.map(pickTeamStrength);
  const maxPower=Math.max(...rows.map(x=>x.power||0),1);
  const maxProj=Math.max(...rows.map(x=>x.proj||0),1);
  const maxPts=Math.max(...rows.map(x=>x.st.points||0),1);
  const week=Math.max(0,typeof nflWeekEstimate==='function'?nflWeekEstimate():0);
  // Preseason: roster/projection dominate. Every played week increases production/record influence.
  const resultWeight=Math.min(.72, week*.055);
  const pointsWeight=Math.min(.20, week*.014);
  const modelWeight=Math.max(.08,1-resultWeight-pointsWeight);
  rows.forEach(r=>{
    const recordScore=r.games?r.winPct:.5;
    const ptsScore=r.st.points/maxPts;
    const rosterScore=((r.power/maxPower)*.60+(r.proj/maxProj)*.40);
    r.finishStrength=recordScore*resultWeight+ptsScore*pointsWeight+rosterScore*modelWeight;
  });
  // Strongest team forecast to finish highest; draft slot 14 in a 14-team league, weakest => 1.
  rows.sort((a,b)=>a.finishStrength-b.finishStrength);
  rows.forEach((r,i)=>{
    r.projectedSlot=i+1;
    const uncertainty=Math.max(.55,3.8-week*.18);
    r.low=Math.max(1,Math.round(r.projectedSlot-uncertainty));
    r.high=Math.min(teams.length,Math.round(r.projectedSlot+uncertainty));
    // Probability of landing in useful slot bands from a simple distance weighting.
    const weights=[];
    let total=0;
    for(let slot=1;slot<=teams.length;slot++){
      const z=(slot-r.projectedSlot)/Math.max(.85,uncertainty*.75);
      const w=Math.exp(-.5*z*z);weights.push({slot,w});total+=w;
    }
    weights.forEach(x=>x.p=x.w/total);
    r.slotProbs=weights;
    r.earlyProb=Math.round(100*weights.filter(x=>x.slot<=Math.ceil(teams.length/3)).reduce((s,x)=>s+x.p,0));
    r.midProb=Math.round(100*weights.filter(x=>x.slot>Math.ceil(teams.length/3)&&x.slot<=Math.ceil(teams.length*2/3)).reduce((s,x)=>s+x.p,0));
    r.lateProb=Math.max(0,100-r.earlyProb-r.midProb);
  });
  return rows;
}
function parsePickAsset(a){
  if(a.type!=='PICK')return null;
  const name=String(a.name||'');
  const yr=Number(a.year||name.match(/20\d{2}/)?.[0]||2027);
  let round=Number(a.round||0);
  if(!round){
    if(/1st|round\s*1|r1/i.test(name))round=1;
    else if(/2nd|round\s*2|r2/i.test(name))round=2;
    else if(/3rd|round\s*3|r3/i.test(name))round=3;
    else if(/4th|round\s*4|r4/i.test(name))round=4;
  }
  const currentOwner=a.roster||a.owner||'Unknown';
  const original=a.originalTeam||a.originalOwner||a.fromTeam||a.pickTeam||
    (name.match(/\(([^)]+)\)/)?.[1])||currentOwner;
  return {...a,year:yr,round:round||1,currentOwner,originalTeam:original};
}
function projectedPickValue(round,slot,year){
  const baseByRound={1:6200,2:2850,3:1250,4:550};
  const base=baseByRound[round]||300;
  // 14-team scale: pick 1 materially more valuable than pick 14.
  const slotMult=round===1
    ? (1.38-(slot-1)*.045)
    : round===2
      ? (1.22-(slot-1)*.025)
      : (1.12-(slot-1)*.014);
  const yearsOut=Math.max(0,year-new Date().getFullYear());
  const timeDiscount=Math.pow(.92,Math.max(0,yearsOut-1));
  return Math.round(base*Math.max(.62,slotMult)*timeDiscount);
}
function livePickForecasts(){
  const finish=leagueFinishForecast();
  const map=new Map(finish.map(x=>[String(x.team).toLowerCase(),x]));
  const picks=(db.assets||[]).map(parsePickAsset).filter(Boolean);
  return picks.map(p=>{
    const f=map.get(String(p.originalTeam||'').toLowerCase());
    const slot=f?.projectedSlot||Math.ceil((db.mfl?.franchises?.length||14)/2);
    const low=f?.low||Math.max(1,slot-3),high=f?.high||Math.min(14,slot+3);
    const value=projectedPickValue(p.round,slot,p.year);
    const lowValue=projectedPickValue(p.round,high,p.year);
    const highValue=projectedPickValue(p.round,low,p.year);
    const tier=slot<=4?'EARLY':slot<=9?'MID':'LATE';
    return {...p,slot,low,high,value,lowValue,highValue,tier,forecast:f};
  }).sort((a,b)=>a.year-b.year||a.round-b.round||a.slot-b.slot);
}

function mflUrl(type, extra=''){
  const m=db.mfl;
  return `https://${mflHost()}/${m.year||2026}/export?TYPE=${encodeURIComponent(type)}&L=${encodeURIComponent(m.leagueId||'29218')}&JSON=1${extra}${m.apiKey?'&APIKEY='+encodeURIComponent(m.apiKey):''}`;
}
async function mflFetch(type,extra=''){
  if(!db.mfl.leagueId) throw new Error('League ID is missing.');
  const res=await fetch(mflUrl(type,extra),{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',headers:{'Accept':'application/json,text/plain,*/*'}});
  if(!res.ok) throw new Error(`${type}: HTTP ${res.status}`);
  const txt=await res.text();
  try{return JSON.parse(txt)}
  catch(e){throw new Error(`${type}: MFL did not return JSON. ${txt.slice(0,120).replace(/\s+/g,' ')}`)}
}

function mflPlayerName(p){
  if(!p)return'';
  if(p.name)return p.name;
  return `${p.firstname||p.firstName||''} ${p.lastname||p.lastName||''}`.trim();
}
function safeNum(v){
  if(v===undefined||v===null||v==='')return undefined;
  const n=Number(String(v).replace(/[$,]/g,''));
  return Number.isFinite(n)?n:undefined;
}
function mergeMFLAsset(p,rp,franchiseName){
  const pid=String(rp?.id||p?.id||'');
  const name=mflPlayerName(p)||rp?.name||pid;
  if(!pid&&!name)return null;
  let hit=db.assets.find(a=>String(a.mflId||'')===pid) ||
          db.assets.find(a=>String(a.name||'').toLowerCase()===String(name).toLowerCase());
  if(!hit){
    hit={id:uid('mfl'),mflId:pid,name,type:'PLAYER',
      pos:String(p?.position||p?.pos||rp?.position||'').toUpperCase(),
      nfl:p?.team||rp?.team||'',age:0,market:1000,adp:0,ecr:0,proj:0,ppg:0,
      role:50,trend:0,risk:45,liquidity:50,salary:0,years:0,
      roster:franchiseName||'FREE AGENT',source:'MFL sync'};
    db.assets.push(hit);
  }
  const old=modelValue(hit);
  hit.mflId=pid||hit.mflId;
  hit.name=name||hit.name;
  hit.pos=String(p?.position||p?.pos||hit.pos||'').toUpperCase();
  hit.nfl=p?.team||hit.nfl||'';
  const mflProj=safeNum(p?.projectedPoints??p?.projected_points??p?.projection??p?.projectedScore??p?.projected_score);
  if(mflProj!==undefined&&mflProj>0){hit.proj=mflProj;hit.sources=hit.sources||{};hit.sources.proj='MFL';}
  const mflBye=safeNum(p?.bye??p?.byeWeek??p?.bye_week);
  if(mflBye!==undefined&&mflBye>0)hit.bye=mflBye;
  const existingRosterSource=hit.sources?.roster||hit.source||'';
  if(authorityRank(existingRosterSource)<=2){
    hit.roster=franchiseName||'FREE AGENT';
    hit.sources=hit.sources||{};
    hit.sources.roster='MFL';
  }
  const sal=safeNum(rp?.salary ?? rp?.sal);
  const yrs=safeNum(rp?.contractYear ?? rp?.contractYears ?? rp?.contract ?? rp?.years);
  if(sal!==undefined)hit.salary=sal;
  if(yrs!==undefined)hit.years=yrs;
  hit.source=(hit.source&&hit.source!=='Manual seed')?hit.source:'MFL + local model';
  hit.lastReason='MFL league sync';
  recordHistory(hit,old);
  return hit;
}
function parseMFLTransactions(obj,franchiseMap,playerMap){
  return mflDeepArray(obj,['transactions.transaction','transaction']).map(t=>{
    const fid=String(t.franchise||t.franchise_id||'');
    const pid=String(t.player||t.player_id||'');
    return {timestamp:t.timestamp||t.date||t.time||'',type:t.type||t.transaction_type||'',
      franchise:franchiseMap[fid]||fid,
      player:mflPlayerName(playerMap[pid])||pid,raw:t};
  });
}

  </div>`;
}

async function proxyFetch(path){
  ensureMFLDefaults();
  let base=(db.mfl.proxyUrl||'').trim().replace(/\/$/,'');
  if(!base) throw new Error('Cloudflare Worker URL is not set yet.');
  const res=await fetch(base+path,{method:'GET',mode:'cors',cache:'no-store',headers:{'Accept':'application/json'}});
  let payload;
  try{payload=await res.json()}catch(e){throw new Error(`Sync service returned HTTP ${res.status} without JSON.`)}
  if(!res.ok || payload?.ok===false) throw new Error(payload?.error||`Sync service HTTP ${res.status}`);
  return payload;
}

async function syncMFL(){
  ensureMFLDefaults();
  saveUndoPoint('Before MFL sync');
  const el=document.getElementById('syncStatus');
  el.innerHTML='Securely syncing <b>Pride LG 29218</b> through the Worker…';
  try{
    const bundle=await proxyFetch('/sync');
    const league=bundle.data?.league||{};
    db.mfl.rawPlayers=bundle.data?.players||{};
    db.mfl.rawRosters=bundle.data?.rosters||{};
    const players=bundle.data?.players||{};
    const rosters=bundle.data?.rosters||{};
    const standings=bundle.data?.standings||{};
    const transactions=bundle.data?.transactions||{};
    const draftResults=bundle.data?.draftResults||{};
    const futureDraftPicks=bundle.data?.futureDraftPicks||{};
    const schedule=bundle.data?.schedule||{};

    const franchises=mflDeepArray(league,['league.franchises.franchise','franchises.franchise']);
    const franchiseMap={};
    franchises.forEach(f=>{
      const id=String(f.id||f.franchise_id||'');
      franchiseMap[id]=f.name||f.owner_name||id;
    });

    const plist=mflDeepArray(players,['players.player','player']);
    const playerMap={};
    plist.forEach(p=>{if(p?.id!==undefined)playerMap[String(p.id)]=p});

    const rosterArr=mflDeepArray(rosters,['rosters.franchise','franchise']);
    const owned=new Set();
    for(const fr of rosterArr){
      const fid=String(fr.id||fr.franchise_id||'');
      const fname=franchiseMap[fid]||fid||'Unknown franchise';
      for(const rp of normalizeArr(fr.player)){
        const pid=String(rp?.id||'');
        if(pid)owned.add(pid);
        mergeMFLAsset(playerMap[pid]||{},rp,fname);
      }
    }

    let freeAgents=0;
    for(const p of plist){
      const pid=String(p?.id||'');
      if(!pid||owned.has(pid))continue;
      const pos=String(p.position||p.pos||'').toUpperCase();
      if(!['QB','RB','WR','TE','PK','K','DL','DE','DT','EDGE','LB','CB','S','DB'].includes(pos))continue;
      const hit=db.assets.find(a=>String(a.mflId||'')===pid);
      if(hit){const src=hit.sources?.roster||hit.source||'';if(authorityRank(src)<=2){hit.roster='FREE AGENT';hit.sources=hit.sources||{};hit.sources.roster='MFL';}}
      else mergeMFLAsset(p,{id:pid},'FREE AGENT');
      freeAgents++;
    }

    db.mfl.standings=mflDeepArray(standings,['leagueStandings.franchise','standings.franchise','franchise']).map(s=>{
      const fid=String(s.id||s.franchise_id||'');
      return {franchise:franchiseMap[fid]||fid,wins:s.h2hw||s.wins||s.w||0,
        losses:s.h2hl||s.losses||s.l||0,points:s.pf||s.points_for||s.points||0,raw:s};
    });
    db.mfl.transactions=parseMFLTransactions(transactions,franchiseMap,playerMap);
    rebuildAuctionHistory();
    const scheduleWeeks=mflDeepArray(schedule,['schedule.week','weeklySchedule.week','week']);
    db.mfl.schedule=[];
    for(const wk of scheduleWeeks){
      const weekNum=Number(wk.week||wk.number||wk.id||0);
      const games=normalizeArr(wk.matchup||wk.game||wk.fantasyMatchup||wk.matches);
      if(games.length){
        for(const g of games){
          const f1=String(g.franchise1||g.team1||g.home||g.home_franchise||g.franchise?.[0]?.id||'');
          const f2=String(g.franchise2||g.team2||g.away||g.away_franchise||g.franchise?.[1]?.id||'');
          db.mfl.schedule.push({week:weekNum,team1:franchiseMap[f1]||f1,team2:franchiseMap[f2]||f2,raw:g});
        }
      }else if(wk&&typeof wk==='object'){
        db.mfl.schedule.push({week:weekNum,raw:wk});
      }
    }
    db.feedTimes=db.feedTimes||{};db.feedTimes.mfl=new Date().toISOString();db.feedTimes.auction=new Date().toISOString();
    
    db.mfl.draftResults=mflDeepArray(draftResults,['draftResults.draftUnit.draftPick','draftResults.draftPick','draftPick']);

    // Best-effort future pick ownership ingestion. MFL's exact nesting can vary by league/year.
    const pickRows=mflDeepArray(futureDraftPicks,[
      'futureDraftPicks.franchise',
      'futureDraftPicks.futureDraftPick',
      'futureDraftPicks.draftPick',
      'franchise',
      'futureDraftPick',
      'draftPick'
    ]);
    if(pickRows.length){
      // Remove only prior MFL-generated future picks so a refresh does not duplicate them.
      db.assets=db.assets.filter(a=>!(a.type==='PICK' && a.source==='MFL future picks'));
      const seen=new Set();
      function addPick(owner,year,round,slotLabel=''){
        owner=franchiseMap[String(owner)]||owner||'';
        year=Number(year)||2027; round=Number(round)||1;
        const key=`${owner}|${year}|${round}|${slotLabel}`;
        if(!owner||seen.has(key))return; seen.add(key);
        const name=`${year} ${slotLabel?slotLabel+' ':''}${round===1?'1st':round===2?'2nd':round===3?'3rd':round+'th'}`.replace(/\s+/g,' ').trim();
        db.assets.push({
          id:uid('pick'),name,type:'PICK',pos:'PICK',roster:owner,year,round,
          market:round===1?5200:round===2?2400:round===3?1000:500,
          classStrength:80,slot:slotLabel||'MID',trend:0,risk:35,liquidity:90,
          salary:0,years:0,proj:0,role:70,source:'MFL future picks',lastReason:'MFL future pick sync'
        });
      }
      pickRows.forEach(row=>{
        const owner=row.franchise_id||row.franchise||row.owner||row.id;
        const nested=normalizeArr(row.pick||row.draftPick||row.futureDraftPick);
        if(nested.length){
          nested.forEach(p=>addPick(owner,p.year||p.season,p.round,p.slot||p.position||''));
        }else{
          addPick(owner,row.year||row.season,row.round,row.slot||row.position||'');
        }
      });
    }

    db.mfl.franchises=franchises.map(f=>({
      id:String(f.id||f.franchise_id||''),
      name:f.name||f.owner_name||String(f.id||''),
      remainingCap:safeNum(f.remainingCap??f.remaining_cap??f.capRoom??f.cap_room??f.availableCap??f.available_cap??f.salaryCapAvailable??f.salary_cap_available),
      salaryCapAmount:safeNum(f.salaryCapAmount??f.salary_cap_amount??f.salaryCap??f.salary_cap??f.capLimit??f.cap_limit),
      raw:f
    }));

    if(league?.league?.name)db.config.leagueName=league.league.name;
    const carnage=db.mfl.franchises.find(f=>/capitol carnage/i.test(f.name));
    if(carnage)db.config.teamName=carnage.name;

    db.mfl.lastCounts={franchises:db.mfl.franchises.length,rostered:owned.size,freeAgents,
      transactions:db.mfl.transactions.length,indexedPlayers:plist.length};
    db.lastSync=bundle.syncedAt||new Date().toISOString();
    audit('MFL SYNC',{franchises:db.mfl.lastCounts?.franchises||0,rostered:db.mfl.lastCounts?.rostered||0,indexedPlayers:db.mfl.lastCounts?.indexedPlayers||0,auctionRecords:db.mfl.auctionHistory?.length||0},'MFL');
    persist();renderAssetList();renderSync();

    const out=document.getElementById('syncStatus');
    if(out)out.innerHTML=`<span class="good">SYNC COMPLETE</span> · ${new Date(db.lastSync).toLocaleString()} · ${db.mfl.lastCounts.franchises} franchises · ${db.mfl.lastCounts.rostered} rostered · ${db.mfl.lastCounts.indexedPlayers} MFL players indexed`;
  }catch(err){
    el.innerHTML=`<span class="bad">SYNC FAILED:</span> ${err.message}`;
  }
}


function applyManualCorrection(){saveUndoPoint('Before manual correction');
  const name=String(document.getElementById('manualCorrName')?.value||'').trim();
  const field=document.getElementById('manualCorrField')?.value||'';
  const val=document.getElementById('manualCorrValue')?.value;
  if(!name||!field)return alert('Enter an asset and field.');
  const a=(db.assets||[]).find(x=>String(x.name||'').toLowerCase()===name.toLowerCase());
  if(!a)return alert('Asset not found.');
  const numeric=['salary','years','proj','market','role','risk'].includes(field);
  a[field]=numeric?Number(val):val;
  a.source='Manual Override';
  if(typeof setFieldSource==='function')setFieldSource(a,field,'Manual Override');
  a.lastReason=`Manual correction: ${field}`;
  persist();renderAssetList();alert(`${a.name}: ${field} corrected.`);
}

  if(aiBusy)return;
  if(aiMessages.length&&!confirm('Clear the AI GM conversation on this device?'))return;
  aiMessages=[];aiLastError='';localStorage.removeItem(AI_MESSAGES_KEY);renderAIGM();
}
async function sendAIQuestion(){
  if(aiBusy)return;
  const input=document.getElementById('aiQuestion');
  const question=String(input?.value||'').trim();
  if(!question)return;
  const provider=document.getElementById('aiProvider')?.value||'consensus';
  aiMessages.push({role:'user',content:question});
  aiMessages=aiMessages.slice(-24);
  localStorage.setItem(AI_MESSAGES_KEY,JSON.stringify(aiMessages));
  aiBusy=true;aiLastError='';renderAIGM();
  try{
    const response=await fetch(`${AI_GATEWAY_URL}/gm-chat`,{
      method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        provider,conversationId:`${db.config?.leagueName||'league'}:${db.config?.teamName||'team'}`,
        messages:aiMessages.slice(-16).map(({role,content})=>({role,content})),
        context:buildAIGMContext(),memory:buildAIGMMemory()
      })
    });
    let payload;
    try{payload=await response.json()}catch(e){throw new Error(`AI gateway returned HTTP ${response.status} without JSON.`)}
    if(!response.ok||!payload.ok)throw new Error(payload.error||`AI gateway returned HTTP ${response.status}.`);
    const text=String(payload.answer?.text||'').trim();
    if(!text)throw new Error('The AI returned an empty answer. Please try again.');
    const model=payload.answer?.model||'';
    aiMessages.push({role:'assistant',content:text,meta:`${aiProviderLabel(provider)}${model?' · '+model:''}`});
    aiMessages=aiMessages.slice(-24);
    localStorage.setItem(AI_MESSAGES_KEY,JSON.stringify(aiMessages));
  }catch(e){
    aiLastError=String(e?.message||e||'Unknown error');
  }finally{
    aiBusy=false;renderAIGM();
  }
}

async function autoRefreshMFL(){
  try{
    ensureMFLDefaults();
    if(!db.mfl.proxyUrl) return;
    const last=db.lastSync?new Date(db.lastSync).getTime():0;
    const stale=!last || (Date.now()-last)>6*60*60*1000;
    if(stale){
      await syncMFL();
      if(localStorage.getItem('ccgm_view')==='trade') renderTrade();
    }
  }catch(e){console.warn('Background MFL refresh skipped',e)}
}

ensureMFLDefaults();persist();nav();renderAssetList();cset('leagueName',db.config.leagueName);let initial=localStorage.getItem('ccgm_view')||'dashboard';showView(initial);setTimeout(autoRefreshMFL,800);
